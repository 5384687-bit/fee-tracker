<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#1e3a5f">
<title>מעקב שכר טרחה</title>
<style>
:root{
  --bg:#f4f6f9; --card:#fff; --ink:#1e293b; --ink2:#64748b; --ink3:#94a3b8;
  --line:#e2e8f0; --brand:#1e3a5f; --brand2:#2c5282; --gold:#b8963f;
  --ok:#0f9d58; --okbg:#e8f5ee; --warn:#d97706; --warnbg:#fef4e6;
  --bad:#dc2626; --badbg:#fdeaea;
  --shadow:0 1px 3px rgba(15,23,42,.08),0 1px 2px rgba(15,23,42,.04);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif;background:var(--bg);
  color:var(--ink);font-size:15px;line-height:1.5;padding-bottom:78px}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:var(--brand2);cursor:pointer}
.hide{display:none !important}

#lock{position:fixed;inset:0;background:linear-gradient(160deg,#1e3a5f,#0f1e33);
  display:flex;align-items:center;justify-content:center;padding:20px;z-index:100;overflow-y:auto}
.lockbox{background:#fff;border-radius:18px;padding:28px 24px;width:100%;max-width:390px;
  box-shadow:0 20px 50px rgba(0,0,0,.35);text-align:center}
.lockbox h1{margin:0 0 6px;font-size:21px;color:var(--brand)}
.lockbox .sub{color:var(--ink2);font-size:13px;margin-bottom:18px;line-height:1.6}
.lockbox input{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:11px;
  margin-bottom:10px;text-align:center}
.lockbox input:focus{outline:none;border-color:var(--brand2)}
.lockbox .go{width:100%;padding:13px;background:var(--brand);color:#fff;border-radius:11px;font-weight:600}
.lockerr{color:var(--bad);font-size:13px;min-height:19px;margin-top:8px}
.lockrow{display:flex;align-items:center;gap:7px;justify-content:center;font-size:12.5px;
  color:var(--ink2);margin:10px 0 2px}
.lockrow input{width:auto;margin:0}
.locknote{font-size:11.5px;color:var(--ink3);margin-top:15px;line-height:1.65;
  border-top:1px solid var(--line);padding-top:13px;text-align:right}

header{background:linear-gradient(135deg,#1e3a5f,#2c5282);color:#fff;padding:15px 16px 13px;
  position:sticky;top:0;z-index:20;box-shadow:0 2px 10px rgba(15,23,42,.15)}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
header h1{margin:0;font-size:17px;font-weight:600}
header h1 span{color:var(--gold)}
.hbtn{color:#fff;opacity:.75;font-size:19px;padding:2px 6px}
.sync{font-size:11px;padding:5px 10px;border-radius:20px;background:rgba(255,255,255,.14);
  margin-top:9px;display:inline-block}
.sync.ok{background:rgba(16,185,129,.28)}
.sync.err{background:rgba(239,68,68,.32)}
.sync.warn{background:rgba(245,158,11,.32)}

main{max-width:960px;margin:0 auto;padding:15px 13px 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:15px;margin-bottom:13px;box-shadow:var(--shadow)}
.card h2{margin:0 0 13px;font-size:15.5px;display:flex;align-items:center;gap:8px}
.card h2 .bar{width:4px;height:17px;background:var(--gold);border-radius:3px}
.card h2 .cnt{font-size:11.5px;background:#eef2f7;color:var(--ink2);padding:2px 8px;border-radius:20px;font-weight:600}
.card.alert{border-color:#f5c6a5;background:linear-gradient(180deg,#fff9f2,#fff)}
.card.alert h2 .bar{background:var(--warn)}
.muted{color:var(--ink2)}
.empty{text-align:center;color:var(--ink3);padding:24px 10px;font-size:13.5px}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:13px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 10px;
  box-shadow:var(--shadow);text-align:center}
.stat .lbl{font-size:11px;color:var(--ink2);margin-bottom:4px}
.stat .val{font-size:17px;font-weight:700;letter-spacing:-.3px}
.stat.g .val{color:var(--ok)} .stat.r .val{color:var(--bad)}

.row{display:flex;align-items:flex-start;gap:11px;padding:12px 8px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.row .grow{flex:1;min-width:0}
.row .nm{font-weight:600;font-size:15px}
.row .meta{font-size:12px;color:var(--ink2);margin-top:3px;line-height:1.55}
.row .amt{font-weight:700;white-space:nowrap;font-size:15px;text-align:left}
.clickable{cursor:pointer;border-radius:10px;transition:background .12s}
.clickable:active,.clickable:hover{background:#f8fafc}
.tel{color:var(--brand2);text-decoration:none}

.tl{position:relative;padding-right:22px}
.tl:before{content:'';position:absolute;top:6px;bottom:6px;right:6px;width:2px;background:var(--line)}
.ent{position:relative;padding:11px 12px 11px 8px;margin-bottom:9px;background:#fff;
  border:1px solid var(--line);border-radius:12px}
.ent:before{content:'';position:absolute;right:-21px;top:17px;width:11px;height:11px;
  border-radius:50%;background:var(--ink3);border:2.5px solid #fff;box-shadow:0 0 0 1.5px var(--line)}
.ent.money:before{background:var(--ok);box-shadow:0 0 0 1.5px #b6e2c8}
.ent.rem:before{background:var(--warn);box-shadow:0 0 0 1.5px #fcd9a0}
.ent .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ent .dt{font-size:11.5px;color:var(--ink3);font-weight:600}
.ent .txt{font-size:14px;margin-top:3px;white-space:pre-line;word-break:break-word}
.ent .sum{font-weight:700;color:var(--ok);white-space:nowrap;font-size:15px}
.ent .rembox{margin-top:7px;font-size:11.5px;background:var(--warnbg);color:#8a5a08;
  border-radius:8px;padding:5px 9px;display:inline-flex;align-items:center;gap:5px}
.ent .rembox.due{background:var(--badbg);color:var(--bad);font-weight:600}
.ent .acts{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
.ent .acts button{font-size:11.5px;color:var(--ink3);padding:3px 8px;border-radius:7px;background:#f6f8fa}
.ent .acts button:hover{color:var(--brand2)}
.ent .acts button.dl:hover{color:var(--bad)}

.badge{display:inline-block;font-size:11px;padding:3px 9px;border-radius:20px;font-weight:600;white-space:nowrap}
.b-ok{background:var(--okbg);color:var(--ok)}
.b-late{background:var(--badbg);color:var(--bad)}
.b-soon{background:var(--warnbg);color:var(--warn)}

.btn{padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;background:var(--brand);
  color:#fff;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:active{opacity:.85}
.btn.sec{background:#eef2f7;color:var(--ink)}
.btn.ok{background:var(--ok)}
.btn.dang{background:var(--badbg);color:var(--bad)}
.btn.sm{padding:7px 12px;font-size:12.5px;border-radius:9px}
.btn.full{width:100%}
.btnbar{display:flex;gap:8px;flex-wrap:wrap}
.fab{position:fixed;bottom:90px;left:16px;z-index:25;padding:14px 20px;border-radius:30px;
  background:var(--brand);color:#fff;font-weight:700;font-size:14.5px;
  box-shadow:0 6px 20px rgba(30,58,95,.4)}

label{display:block;font-size:12.5px;font-weight:600;color:var(--ink2);margin:0 0 5px}
.fld{margin-bottom:12px}
input[type=text],input[type=number],input[type=date],input[type=tel],
input[type=password],select,textarea{width:100%;padding:11px 12px;border:1.5px solid var(--line);
  border-radius:10px;background:#fff;transition:border-color .12s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand2)}
textarea{resize:vertical;min-height:66px}
input[type=date],input[type=number],input[type=tel]{direction:ltr;text-align:right}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{padding:8px 13px;border-radius:20px;border:1.5px solid var(--line);background:#fff;font-size:13px;font-weight:500}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.switch{display:flex;align-items:center;gap:9px;padding:11px 12px;background:#f8fafc;
  border:1.5px solid var(--line);border-radius:11px;margin-bottom:12px;cursor:pointer}
.switch input{width:19px;height:19px;margin:0;accent-color:var(--brand)}
.switch label{margin:0;font-weight:600;color:var(--ink);cursor:pointer;font-size:13.5px}

.modal{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:60;
  display:flex;align-items:flex-end;justify-content:center}
.modal-in{background:#fff;border-radius:18px 18px 0 0;width:100%;max-width:620px;
  max-height:92vh;overflow-y:auto;padding:16px 15px calc(20px + env(safe-area-inset-bottom))}
@media(min-width:700px){.modal{align-items:center;padding:20px}
  .modal-in{border-radius:16px;max-height:88vh}}
.modal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;
  position:sticky;top:-16px;background:#fff;padding:6px 0 9px;z-index:2}
.modal-h h3{margin:0;font-size:17px}
.x{font-size:25px;color:var(--ink3);line-height:1;padding:0 8px}

nav{position:fixed;bottom:0;right:0;left:0;background:#fff;border-top:1px solid var(--line);
  display:flex;z-index:30;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -2px 12px rgba(15,23,42,.06)}
nav button{flex:1;padding:9px 2px 8px;font-size:11px;color:var(--ink3);
  display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:600;position:relative}
nav button .ic{font-size:19px;line-height:1}
nav button.on{color:var(--brand)}
nav .dot{position:absolute;top:6px;left:50%;margin-left:9px;width:8px;height:8px;
  border-radius:50%;background:var(--bad)}

.search{margin-bottom:12px}
.progbar{height:7px;background:#eef2f7;border-radius:5px;overflow:hidden;margin-top:8px}
.progbar i{display:block;height:100%;background:linear-gradient(90deg,#0f9d58,#34d399);border-radius:5px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.kv:last-child{border-bottom:none}
.kv b{font-weight:700}
.toast{position:fixed;bottom:88px;right:50%;transform:translateX(50%);background:var(--ink);
  color:#fff;padding:11px 20px;border-radius:24px;font-size:13.5px;z-index:90;
  box-shadow:0 6px 20px rgba(0,0,0,.25);opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.hint{font-size:12px;color:var(--ink3);line-height:1.6;margin-top:6px}
.warnbox{background:var(--warnbg);border:1px solid #fcd9a0;border-radius:11px;padding:11px 12px;
  font-size:12.5px;color:#8a5a08;line-height:1.65;margin-bottom:12px}
.okbox{background:var(--okbg);border:1px solid #b6e2c8;border-radius:11px;padding:11px 12px;
  font-size:12.5px;color:#0b6b3d;line-height:1.65;margin-bottom:12px}
.back{font-size:13px;color:var(--brand2);font-weight:600;margin-bottom:10px;display:inline-block}
.head{background:linear-gradient(135deg,#1e3a5f,#2c5282);color:#fff;border-radius:14px;
  padding:16px;margin-bottom:13px;box-shadow:var(--shadow)}
.head .nm{font-size:20px;font-weight:700}
.head .ph{font-size:13px;margin-top:3px}
.head .ph a{color:#fff;opacity:.85;text-decoration:none;border-bottom:1px dotted rgba(255,255,255,.5)}
.head .g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.head .g3 div{background:rgba(255,255,255,.12);border-radius:10px;padding:9px 8px;text-align:center}
.head .g3 .l{font-size:10.5px;opacity:.75}
.head .g3 .v{font-size:15px;font-weight:700;margin-top:2px}
table.rep{width:100%;border-collapse:collapse;font-size:13px}
table.rep th{text-align:right;font-size:11.5px;color:var(--ink2);padding:7px 6px;border-bottom:1.5px solid var(--line)}
table.rep td{padding:8px 6px;border-bottom:1px solid var(--line)}
table.rep tr:last-child td{border-bottom:none}
.bars{margin-top:4px}
.barrow{display:flex;align-items:center;gap:8px;margin-bottom:7px;font-size:12.5px}
.barrow .bl{width:62px;color:var(--ink2);white-space:nowrap}
.barrow .bt{flex:1;height:20px;background:#eef2f7;border-radius:4px;overflow:hidden}
.barrow .bt i{display:block;height:100%;background:linear-gradient(90deg,#2c5282,#4a7ab5)}
.barrow .bv{width:74px;text-align:left;font-weight:600;white-space:nowrap}
</style>
</head>
<body>

<div id="lock">
  <div class="lockbox">
    <div style="font-size:34px;margin-bottom:6px">⚖️</div>
    <h1>מעקב שכר טרחה</h1>
    <div class="sub" id="lockSub">טוען…</div>
    <div id="lockForm" class="hide">
      <input type="password" id="pass1" placeholder="סיסמה" autocomplete="current-password">
      <input type="password" id="pass2" class="hide" placeholder="אימות סיסמה" autocomplete="new-password">
      <button class="go" id="lockGo">כניסה</button>
      <div class="lockrow">
        <input type="checkbox" id="remember">
        <label for="remember" style="margin:0;font-weight:500;color:var(--ink2)">זכור אותי במכשיר הזה</label>
      </div>
      <div class="lockerr" id="lockErr"></div>
      <div class="locknote" id="lockNote"></div>
    </div>
  </div>
</div>

<div id="app" class="hide">
<header>
  <div class="hrow">
    <h1>מעקב <span>שכר טרחה</span></h1>
    <button class="hbtn" onclick="go('settings')" title="הגדרות">⚙️</button>
  </div>
  <div class="sync" id="syncStatus">☁️ מקומי בלבד</div>
</header>

<main id="view"></main>
<button class="fab hide" id="fab" onclick="editPayment()">＋ תשלום חדש</button>

<nav>
  <button data-nav="list"      onclick="go('list')"><span class="ic">💰</span>תשלומים</button>
  <button data-nav="reminders" onclick="go('reminders')"><span class="ic">🔔</span>תזכורות</button>
  <button data-nav="reports"   onclick="go('reports')"><span class="ic">📈</span>דוחות</button>
</nav>
</div>

<div id="modalHost"></div>
<div class="toast" id="toast"></div>

<script>
"use strict";

/* ==================================================================
   1. CONSTANTS
   ================================================================== */
const LS_BLOB = 'ft_blob', LS_SYNC = 'ft_sync', LS_PASS = 'ft_pass';
const PBKDF2_ITER = 250000;
/* quick-pick phrases for the free-text content field */
const QUICK_TEXTS = ['התקבל תשלום','נשלחה דרישת תשלום','שיחה עם הלקוח','נשלח מייל','נחתם הסכם שכ״ט','הוגשה חשבונית'];

let DB = null, KEY = null, SALT = null;
let screen = 'list', curPay = null;
let syncUrl = '', dirty = false;

/* ==================================================================
   2. UTILITIES
   ================================================================== */
const $ = id => document.getElementById(id);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function money(n){
  const v = Math.round((Number(n) || 0) * 100) / 100;
  return '₪' + v.toLocaleString('he-IL', {maximumFractionDigits: 2});
}
function todayKey(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function heDate(key){
  if(!key) return '—';
  const [y,m,d] = key.split('-').map(Number);
  return new Date(y, m-1, d).toLocaleDateString('he-IL', {day:'numeric', month:'numeric', year:'2-digit'});
}
function heDateLong(key){
  if(!key) return '—';
  const [y,m,d] = key.split('-').map(Number);
  return new Date(y, m-1, d).toLocaleDateString('he-IL', {weekday:'short', day:'numeric', month:'long', year:'numeric'});
}
function daysUntil(key){
  if(!key) return 9999;
  const [y,m,d] = key.split('-').map(Number);
  const t = new Date(); t.setHours(0,0,0,0);
  return Math.round((new Date(y, m-1, d) - t) / 86400000);
}
function addDays(key, n){
  const [y,m,d] = key.split('-').map(Number);
  const dt = new Date(y, m-1, d + n);
  return dt.getFullYear() + '-' + String(dt.getMonth()+1).padStart(2,'0') + '-' + String(dt.getDate()).padStart(2,'0');
}
function toast(msg){
  const t = $('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ==================================================================
   3. CRYPTO
   ================================================================== */
const te = new TextEncoder(), td = new TextDecoder();
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function deriveKey(pass, salt){
  const base = await crypto.subtle.importKey('raw', te.encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    {name:'PBKDF2', salt, iterations:PBKDF2_ITER, hash:'SHA-256'},
    base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
async function encryptDB(obj, key, salt){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, te.encode(JSON.stringify(obj)));
  return {ft:1, alg:'AES-GCM-256', salt:b64(salt), iv:b64(iv), ct:b64(ct)};
}
async function decryptDB(blob, key){
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:unb64(blob.iv)}, key, unb64(blob.ct));
  return JSON.parse(td.decode(pt));
}
const isBlob = b => b && b.ft === 1 && b.ct && b.iv && b.salt;

/* ==================================================================
   4. STORAGE + SYNC
   ================================================================== */
function freshDB(){
  return {v:3, updatedAt:new Date().toISOString(),
          settings:{notify:false}, payments:[], entries:[]};
}
function localBlob(){
  try { return JSON.parse(localStorage.getItem(LS_BLOB)); } catch(e){ return null; }
}
async function fetchRemote(){
  if(!syncUrl) return null;
  const res = await fetch(syncUrl, {cache:'no-store'});
  if(!res.ok) throw new Error('HTTP ' + res.status);
  const j = await res.json();
  return isBlob(j) ? j : null;
}
async function pushRemote(blob){
  if(!syncUrl) return;
  const res = await fetch(syncUrl, {method:'POST', headers:{'Content-Type':'application/json'},
                                    body:JSON.stringify(blob)});
  if(!res.ok) throw new Error('HTTP ' + res.status);
}
function setSync(state, text){
  const el = $('syncStatus');
  el.className = 'sync' + (state ? ' ' + state : '');
  el.textContent = text;
}
async function save(){
  if(!DB || !KEY) return;
  DB.updatedAt = new Date().toISOString();
  const blob = await encryptDB(DB, KEY, SALT);
  try { localStorage.setItem(LS_BLOB, JSON.stringify(blob)); }
  catch(e){ toast('שגיאה בשמירה מקומית'); }
  if(!syncUrl){ setSync('', '💾 נשמר במכשיר הזה'); return; }
  setSync('warn', '☁️ מסנכרן…');
  try { await pushRemote(blob); dirty = false; setSync('ok', '☁️ מסונכרן'); }
  catch(e){ dirty = true; setSync('err', '⚠️ אין חיבור — נשמר במכשיר, יסונכרן בהמשך'); }
}
setInterval(() => { if(dirty && syncUrl && navigator.onLine) save(); }, 30000);
window.addEventListener('online', () => { if(dirty) save(); });

/* ==================================================================
   5. MIGRATION  ->  v3 (one flat list of payments)
   ================================================================== */
function migrate(db){
  if(!db || db.v === 3) return db;
  const out = freshDB();
  out.settings.notify = !!(db.settings && db.settings.notify);
  const rate = ((db.settings && db.settings.vatRate != null) ? db.settings.vatRate : 18) / 100;

  if(db.v === 2){
    /* v2: clients carrying a fee + entries keyed by clientId */
    out.payments = (db.clients || []).map(c => ({
      id: c.id, name: c.name, phone: c.phone || '',
      /* fold VAT into a single final amount — v3 has no separate VAT field */
      amount: Math.round((c.vatMode === 'plus' ? (Number(c.feeAmount)||0) * (1 + rate)
                                               : (Number(c.feeAmount)||0)) * 100) / 100,
      notes: c.notes || '', createdAt: c.createdAt || todayKey()
    }));
    out.entries = (db.entries || []).map(e => Object.assign({}, e, {paymentId: e.clientId}));
    out.entries.forEach(e => { delete e.clientId; });
    return out;
  }

  /* v1: clients + matters + payments */
  const byClient = {};
  (db.clients || []).forEach(c => {
    byClient[c.id] = {id:c.id, name:c.name, phone:c.phone || '', amount:0,
                      notes:c.notes || '', createdAt:c.createdAt || todayKey()};
  });
  (db.matters || []).forEach(m => {
    const p = byClient[m.clientId]; if(!p) return;
    const base = Number(m.feeAmount) || 0;
    p.amount += (m.vatMode === 'plus' ? base * (1 + rate) : base);
    if(m.title) p.notes = ((p.notes ? p.notes + '\n' : '') + m.title).trim();
  });
  (db.payments || []).forEach(p => {
    const m = (db.matters || []).find(x => x.id === p.matterId);
    if(!m || !byClient[m.clientId]) return;
    const paid = p.status === 'paid';
    out.entries.push({
      id: p.id || uid(), paymentId: m.clientId,
      date: (paid ? p.paidDate : p.dueDate) || todayKey(),
      content: [p.notes, m.title, paid ? p.method : (p.status === 'cancelled' ? 'בוטל' : 'תשלום מתוכנן'),
                p.receiptNo ? 'קבלה ' + p.receiptNo : ''].filter(Boolean).join(' · '),
      amount: paid ? (Number(p.amount) || 0) : 0,
      reminderAt: (!paid && p.status === 'pending') ? (p.dueDate || null) : null,
      reminderDone: false, createdAt: p.createdAt || todayKey()
    });
  });
  out.payments = Object.values(byClient).map(p =>
    Object.assign(p, {amount: Math.round(p.amount * 100) / 100}));
  return out;
}

/* ==================================================================
   6. DOMAIN
   ================================================================== */
const payById = id => DB.payments.find(p => p.id === id);
const payName = id => { const p = payById(id); return p ? p.name : '—'; };

const payEntries = id => DB.entries.filter(e => e.paymentId === id)
  .sort((a,b) => (a.date === b.date ? String(b.createdAt||'').localeCompare(String(a.createdAt||''))
                                    : (a.date < b.date ? 1 : -1)));
/** How much has actually come in against this payment. */
const paidOf = id => DB.entries.filter(e => e.paymentId === id)
  .reduce((s,e) => s + (Number(e.amount) || 0), 0);
const balanceOf = p => (Number(p.amount) || 0) - paidOf(p.id);

function dueReminders(){
  return DB.entries.filter(e => e.reminderAt && !e.reminderDone && daysUntil(e.reminderAt) <= 0)
    .sort((a,b) => a.reminderAt < b.reminderAt ? -1 : 1);
}
function upcomingReminders(){
  return DB.entries.filter(e => e.reminderAt && !e.reminderDone && daysUntil(e.reminderAt) > 0)
    .sort((a,b) => a.reminderAt < b.reminderAt ? -1 : 1);
}

/* ==================================================================
   7. ROUTER
   ================================================================== */
function go(s, id){
  screen = s;
  if(s === 'pay') curPay = id;
  window.scrollTo(0, 0);
  render();
}
function render(){
  const navMap = {pay:'list'};
  document.querySelectorAll('nav button').forEach(b => {
    b.classList.toggle('on', b.dataset.nav === (navMap[screen] || screen));
    const old = b.querySelector('.dot'); if(old) old.remove();
  });
  if(DB && dueReminders().length){
    const btn = document.querySelector('nav button[data-nav="reminders"]');
    if(btn){ const d = document.createElement('span'); d.className = 'dot'; btn.appendChild(d); }
  }
  /* the floating add button belongs only to the main list */
  $('fab').classList.toggle('hide', screen !== 'list');
  const fn = {list:viewList, pay:viewPay, reminders:viewReminders,
              reports:viewReports, settings:viewSettings}[screen];
  $('view').innerHTML = fn ? fn() : '';
}

/* ==================================================================
   8. MAIN LIST — everything revolves around payments
   ================================================================== */
let listQ = '', listFilter = 'open';
function viewList(){
  const total = DB.payments.reduce((s,p) => s + (Number(p.amount)||0), 0);
  const paid  = DB.entries.reduce((s,e) => s + (Number(e.amount)||0), 0);

  let h = '<div class="stats">' +
    stat('סה״כ', money(total)) +
    stat('שולם', money(paid), 'g') +
    stat('יתרה', money(total - paid), total - paid > 0.5 ? 'r' : 'g') +
  '</div>';

  const due = dueReminders();
  if(due.length){
    h += '<div class="card alert"><h2><span class="bar"></span>🔔 תזכורות להיום<span class="cnt">' +
      due.length + '</span></h2>' + due.map(remRow).join('') + '</div>';
  }

  if(!DB.payments.length){
    return h + '<div class="card"><div class="empty">' +
      '<div style="font-size:38px;margin-bottom:8px">💰</div>' +
      'עוד אין תשלומים.<br>מוסיפים שם, טלפון וסכום — וזהו.' +
      '<div style="margin-top:16px"><button class="btn" onclick="editPayment()">＋ תשלום חדש</button></div>' +
      '</div></div>';
  }

  h += '<div class="chips" style="margin-bottom:12px">' +
    [['open','לא שולמו'],['paid','שולמו'],['all','הכל']].map(f =>
      '<button class="chip' + (listFilter === f[0] ? ' on' : '') +
      '" onclick="listFilter=\'' + f[0] + '\';render()">' + f[1] + '</button>').join('') + '</div>';
  h += '<div class="search"><input type="text" id="lq" placeholder="חיפוש לפי שם או טלפון" value="' +
       esc(listQ) + '" oninput="listQ=this.value;renderList()"></div>';
  h += '<div id="payList">' + listHTML() + '</div>';
  return h;
}
function renderList(){ $('payList').innerHTML = listHTML(); }
function listHTML(){
  let list = DB.payments.slice();
  if(listFilter === 'open') list = list.filter(p => balanceOf(p) > 0.5);
  if(listFilter === 'paid') list = list.filter(p => balanceOf(p) <= 0.5);
  const q = listQ.trim();
  if(q) list = list.filter(p => (p.name + ' ' + (p.phone||'')).includes(q));
  list.sort((a,b) => balanceOf(b) - balanceOf(a));
  if(!list.length) return '<div class="card"><div class="empty">אין תשלומים להצגה</div></div>';

  return '<div class="card">' + list.map(p => {
    const amt = Number(p.amount) || 0, pd = paidOf(p.id), bal = amt - pd;
    const pct = amt > 0 ? Math.min(100, Math.round(pd / amt * 100)) : 0;
    const hasDue = DB.entries.some(e => e.paymentId === p.id && e.reminderAt &&
                                        !e.reminderDone && daysUntil(e.reminderAt) <= 0);
    return '<div class="row clickable" onclick="go(\'pay\',\'' + p.id + '\')">' +
      '<div class="grow"><div class="nm">' + esc(p.name) +
        (hasDue ? ' <span class="badge b-late">🔔</span>' : '') + '</div>' +
      '<div class="meta">' + (p.phone ? esc(p.phone) + ' · ' : '') +
        money(amt) + (pd > 0 ? ' · שולם ' + pct + '%' : '') + '</div>' +
      (pd > 0 && bal > 0.5 ? '<div class="progbar"><i style="width:' + pct + '%"></i></div>' : '') + '</div>' +
      '<div class="amt" style="color:' + (bal > 0.5 ? 'var(--bad)' : 'var(--ok)') + '">' +
      (bal > 0.5 ? money(bal) : '✓ שולם') + '</div></div>';
  }).join('') + '</div>';
}
function stat(lbl, val, cls){
  return '<div class="stat ' + (cls||'') + '"><div class="lbl">' + lbl + '</div><div class="val">' + val + '</div></div>';
}
function remRow(e){
  const d = daysUntil(e.reminderAt);
  const when = d < 0 ? 'עבר לפני ' + Math.abs(d) + ' ימים' : d === 0 ? 'היום' : 'בעוד ' + d + ' ימים';
  return '<div class="row">' +
    '<div class="grow clickable" onclick="go(\'pay\',\'' + e.paymentId + '\')">' +
    '<div class="nm">' + esc(payName(e.paymentId)) + '</div>' +
    '<div class="meta">' + esc(e.content || 'תזכורת') + '<br>' +
      '<span class="badge ' + (d <= 0 ? 'b-late' : 'b-soon') + '">' + heDate(e.reminderAt) + ' · ' + when + '</span>' +
    '</div></div>' +
    '<button class="btn sm ok" onclick="doneReminder(\'' + e.id + '\')">בוצע</button></div>';
}
async function doneReminder(id){
  const e = DB.entries.find(x => x.id === id);
  if(e) e.reminderDone = true;
  await save(); render(); toast('התזכורת סומנה כבוצעה');
}
async function snoozeReminder(id, days){
  const e = DB.entries.find(x => x.id === id);
  if(e){ e.reminderAt = addDays(todayKey(), days); e.reminderDone = false; }
  await save(); render(); toast('נדחתה ל־' + days + ' ימים');
}

/* ==================================================================
   9. ADD / EDIT A PAYMENT  — name, phone, amount
   ================================================================== */
function editPayment(id){
  const p = id ? payById(id) : null;
  modal(p ? 'עריכת תשלום' : 'תשלום חדש',
    fld('שם הלקוח *', '<input type="text" id="p_name" value="' + esc(p ? p.name : '') + '">') +
    fld('טלפון', '<input type="tel" id="p_phone" value="' + esc(p ? p.phone : '') + '">') +
    fld('סכום (₪) *', '<input type="number" id="p_amount" step="0.01" min="0" value="' +
        (p && p.amount ? p.amount : '') + '">') +
    fld('הערות', '<textarea id="p_notes">' + esc(p ? p.notes : '') + '</textarea>') +
    '<button class="btn full" onclick="savePayment(' + (id ? "'" + id + "'" : 'null') + ')">שמירה</button>');
  setTimeout(() => $('p_name').focus(), 80);
}
async function savePayment(id){
  const name = $('p_name').value.trim();
  if(!name) return toast('חובה להזין שם');
  const amount = Number($('p_amount').value) || 0;
  const data = {name, phone:$('p_phone').value.trim(), amount, notes:$('p_notes').value.trim()};
  let newId = id;
  if(id) Object.assign(payById(id), data);
  else { newId = uid(); DB.payments.push(Object.assign({id:newId, createdAt:todayKey()}, data)); }
  closeModal(); await save();
  if(id) render(); else go('pay', newId);
  toast('נשמר');
}
async function delPayment(id){
  const n = DB.entries.filter(e => e.paymentId === id).length;
  if(!confirm(n ? 'לתשלום זה ' + n + ' שורות ביומן. המחיקה תמחק גם אותן. להמשיך?' : 'למחוק תשלום זה?')) return;
  DB.entries = DB.entries.filter(e => e.paymentId !== id);
  DB.payments = DB.payments.filter(p => p.id !== id);
  await save(); go('list'); toast('נמחק');
}

  if(p.phone) h += '<div class="ph"><a href="tel:' + esc(p.phone) + '">📞 ' + esc(p.phone) + '</a></div>';
  h += '<div class="g3">' +
    '<div><div class="l">סכום</div><div class="v">' + money(amt) + '</div></div>' +
    '<div><div class="l">שולם</div><div class="v">' + money(pd) + '</div></div>' +

  h += '<div class="btnbar" style="margin-bottom:13px">' +
    '<button class="btn" onclick="editEntry(null,\'' + p.id + '\')">＋ שורה חדשה</button>' +

  return h + '</div>';

function entryHTML(e){
  const hasMoney = Number(e.amount) > 0;
  const remLive = e.reminderAt && !e.reminderDone;
  const d = remLive ? daysUntil(e.reminderAt) : null;
  let h = '<div class="ent' + (hasMoney ? ' money' : '') + (remLive && !hasMoney ? ' rem' : '') + '">';
  h += '<div class="top"><div style="flex:1;min-width:0">' +
       '<div class="dt">' + heDateLong(e.date) + '</div>' +
       '<div class="txt">' + (e.content ? esc(e.content) : '<span class="muted">—</span>') + '</div></div>';
  if(hasMoney) h += '<div class="sum">' + money(e.amount) + '</div>';
  h += '</div>';
  if(remLive){
    h += '<div class="rembox' + (d <= 0 ? ' due' : '') + '">🔔 תזכורת ' + heDate(e.reminderAt) +
         (d < 0 ? ' · עבר לפני ' + Math.abs(d) + ' ימים' : d === 0 ? ' · היום' : ' · בעוד ' + d + ' ימים') + '</div>';
  } else if(e.reminderAt && e.reminderDone){
    h += '<div class="rembox" style="background:#eef2f7;color:var(--ink3)">✓ תזכורת בוצעה</div>';
  }
  h += '<div class="acts">' +
    (remLive ? '<button onclick="doneReminder(\'' + e.id + '\')">סמן תזכורת כבוצעה</button>' +
               '<button onclick="snoozeReminder(\'' + e.id + '\',7)">דחה שבוע</button>' : '') +
    '<button onclick="editEntry(\'' + e.id + '\')">עריכה</button>' +
    '<button class="dl" onclick="delEntry(\'' + e.id + '\')">מחיקה</button></div>';
  return h + '</div>';
}

/* ==================================================================
   11. LOG ENTRIES — date + content + optional amount + optional reminder
   ================================================================== */
function editEntry(id, paymentId){
  if(!DB.payments.length){ toast('צריך להוסיף תשלום קודם'); return; }
  const e = id ? DB.entries.find(x => x.id === id) : null;
  const pid = e ? e.paymentId : (paymentId || curPay || DB.payments[0].id);
  const opts = DB.payments.slice().sort((a,b) => a.name.localeCompare(b.name,'he'))
    .map(p => '<option value="' + p.id + '"' + (p.id === pid ? ' selected' : '') + '>' + esc(p.name) + '</option>').join('');
  const remOn = !!(e && e.reminderAt && !e.reminderDone);
  const remDays = remOn ? Math.max(0, daysUntil(e.reminderAt)) : 7;

  modal(e ? 'עריכת שורה' : 'שורה חדשה',
    fld('תשלום *', '<select id="e_pay">' + opts + '</select>') +
    fld('תאריך *', '<input type="date" id="e_date" value="' + esc(e ? e.date : todayKey()) + '">') +
    fld('תוכן', '<textarea id="e_content" placeholder="מה קרה / מה סוכם / איזה תשלום התקבל">' +
        esc(e ? e.content : '') + '</textarea>' +
        '<div class="chips" style="margin-top:8px">' +
        QUICK_TEXTS.map(t => '<button type="button" class="chip" onclick="addQuick(this)">' +
          esc(t) + '</button>').join('') + '</div>') +
    fld('סכום ששולם (₪) — אם התקבל תשלום',
        '<input type="number" id="e_amount" step="0.01" min="0" placeholder="השאירי ריק אם זו רק רשומה" value="' +
        (e && Number(e.amount) > 0 ? e.amount : '') + '">') +
    '<div class="switch" onclick="if(event.target.tagName!==\'INPUT\')' +
      '{var b=document.getElementById(\'e_rem\');b.checked=!b.checked;toggleRem();}">' +
      '<input type="checkbox" id="e_rem"' + (remOn ? ' checked' : '') + ' onchange="toggleRem()">' +
      '<label for="e_rem">🔔 הפעלת תזכורת</label></div>' +
    '<div id="remFields" class="hide">' +
      fld('תזכורת בעוד כמה ימים?',
          '<div class="chips" style="margin-bottom:9px">' +
          [3,7,14,30,60].map(d => '<button type="button" class="chip" onclick="setRemDays(' + d + ')">' +
            d + ' ימים</button>').join('') + '</div>' +
          '<input type="number" id="e_remdays" min="0" value="' + remDays + '" oninput="updRemHint()">') +
      '<div class="okbox" id="remHint"></div>' +
    '</div>' +
    '<button class="btn full" onclick="saveEntry(' + (id ? "'" + id + "'" : 'null') + ')">שמירה</button>');

  $('e_date').addEventListener('change', updRemHint);
  toggleRem();
  setTimeout(() => $('e_content').focus(), 80);
}
/** Append a quick phrase rather than replacing what is already typed. */
function addQuick(btn){
  const t = $('e_content');
  t.value = t.value.trim() ? t.value.trim() + ' · ' + btn.textContent : btn.textContent;
  t.focus();
}
function setRemDays(d){ $('e_remdays').value = d; updRemHint(); }
function toggleRem(){
  const on = $('e_rem').checked;
  $('remFields').classList.toggle('hide', !on);
  if(on) updRemHint();
}
function updRemHint(){
  const d = Math.max(0, Number($('e_remdays').value) || 0);
  $('remHint').innerHTML = 'התזכורת תופיע ב־<b>' + heDateLong(addDays($('e_date').value || todayKey(), d)) + '</b>';
}
async function saveEntry(id){
  const date = $('e_date').value;
  if(!date) return toast('חובה להזין תאריך');
  const amtRaw = $('e_amount').value.trim();
  const amount = amtRaw === '' ? 0 : Number(amtRaw);
  if(amount < 0 || isNaN(amount)) return toast('סכום לא תקין');
  const content = $('e_content').value.trim();
  if(!content && !amount) return toast('צריך תוכן או סכום');

  const remOn = $('e_rem').checked;
  const data = {
    paymentId: $('e_pay').value, date, content, amount,
    reminderAt: remOn ? addDays(date, Math.max(0, Number($('e_remdays').value) || 0)) : null,
    reminderDone: false
  };
  if(id){
    const e = DB.entries.find(x => x.id === id);
    /* an unchanged reminder that was already ticked off stays ticked off */
    if(remOn && e.reminderAt === data.reminderAt && e.reminderDone) data.reminderDone = true;
    Object.assign(e, data);
  } else {
    DB.entries.push(Object.assign({id:uid(), createdAt:new Date().toISOString()}, data));
  }
  closeModal(); await save(); render(); toast('נשמר');
}
async function delEntry(id){
  if(!confirm('למחוק שורה זו?')) return;
  DB.entries = DB.entries.filter(e => e.id !== id);
  await save(); render(); toast('נמחק');
}

/* ==================================================================
   12. REMINDERS
   ================================================================== */
function viewReminders(){
  const due = dueReminders(), up = upcomingReminders();
  const done = DB.entries.filter(e => e.reminderAt && e.reminderDone)
    .sort((a,b) => a.reminderAt < b.reminderAt ? 1 : -1).slice(0, 15);

  let h = '<div class="card' + (due.length ? ' alert' : '') + '"><h2><span class="bar"></span>הגיע זמנן' +
       (due.length ? '<span class="cnt">' + due.length + '</span>' : '') + '</h2>';
  h += due.length ? due.map(remRow).join('') : '<div class="empty">אין תזכורות פתוחות 🎉</div>';
  h += '</div>';

  h += '<div class="card"><h2><span class="bar"></span>עתידיות' +
       (up.length ? '<span class="cnt">' + up.length + '</span>' : '') + '</h2>';
  h += up.length ? up.map(remRow).join('') : '<div class="empty">אין תזכורות עתידיות</div>';
  h += '</div>';

  if(done.length){
    h += '<div class="card"><h2><span class="bar"></span>בוצעו</h2>' + done.map(e =>
      '<div class="row clickable" onclick="go(\'pay\',\'' + e.paymentId + '\')">' +
      '<div class="grow"><div class="nm" style="color:var(--ink2)">' + esc(payName(e.paymentId)) + '</div>' +
      '<div class="meta">' + esc(e.content || '') + ' · ' + heDate(e.reminderAt) + '</div></div>' +
      '<span class="badge b-ok">✓</span></div>').join('') + '</div>';
  }
  return h;
}

/* ==================================================================
   13. REPORTS
   ================================================================== */
function viewReports(){
  const months = [];
  const now = new Date();
  for(let i = 11; i >= 0; i--){
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    months.push(d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'));
  }
  const byMonth = {}; months.forEach(k => byMonth[k] = 0);
  DB.entries.forEach(e => {
    const k = (e.date||'').slice(0,7);
    if(k in byMonth) byMonth[k] += Number(e.amount) || 0;
  });
  const max = Math.max(1, ...Object.values(byMonth));
  const yearTotal = Object.values(byMonth).reduce((s,v) => s+v, 0);

  let h = '<div class="card"><h2><span class="bar"></span>גבייה ב־12 החודשים האחרונים</h2>';
  h += '<div class="kv"><span class="muted">סה״כ</span><b>' + money(yearTotal) + '</b></div>';
  h += '<div class="bars" style="margin-top:12px">' + months.map(k => {
    const v = byMonth[k], [y,mm] = k.split('-');
    return '<div class="barrow"><div class="bl">' + mm + '/' + y.slice(2) + '</div>' +
      '<div class="bt"><i style="width:' + Math.round(v / max * 100) + '%"></i></div>' +
      '<div class="bv">' + (v ? money(v) : '—') + '</div></div>';
  }).join('') + '</div></div>';

  const rows = DB.payments.map(p => ({name:p.name, phone:p.phone, a:Number(p.amount)||0,
                                      pd:paidOf(p.id), bal:balanceOf(p)}))
    .sort((a,b) => b.bal - a.bal);
  h += '<div class="card"><h2><span class="bar"></span>פירוט מלא</h2>';
  h += rows.length
    ? '<div style="overflow-x:auto"><table class="rep"><thead><tr><th>שם</th><th>סכום</th><th>שולם</th><th>יתרה</th></tr></thead><tbody>' +
      rows.map(r => '<tr><td>' + esc(r.name) + '</td><td>' + money(r.a) + '</td>' +
        '<td style="color:var(--ok)">' + money(r.pd) + '</td>' +
        '<td style="color:' + (r.bal > 0.5 ? 'var(--bad)' : 'var(--ok)') + ';font-weight:700">' +
        money(r.bal) + '</td></tr>').join('') + '</tbody></table></div>'
    : '<div class="empty">אין נתונים</div>';
  h += '</div>';

  h += '<div class="card"><h2><span class="bar"></span>ייצוא</h2>' +
    '<div class="btnbar"><button class="btn sm sec" onclick="exportCSV()">ייצוא ל־CSV</button>' +
    '<button class="btn sm sec" onclick="exportJSON()">גיבוי מלא (JSON)</button></div>' +
    '<div class="hint">קובץ ה־CSV נפתח באקסל. הגיבוי המלא אינו מוצפן — שמרי אותו במקום בטוח.</div></div>';
  return h;
}
function exportCSV(){
  const cell = v => '"' + String(v == null ? '' : v).replace(/"/g,'""') + '"';
  const lines = [['שם','טלפון','תאריך','תוכן','סכום ששולם','תזכורת','בוצעה'].join(',')];
  DB.entries.slice().sort((a,b) => a.date < b.date ? 1 : -1).forEach(e => {
    const p = payById(e.paymentId);
    lines.push([p ? p.name : '', p ? p.phone : '', e.date, e.content || '',
                Number(e.amount) > 0 ? e.amount : '',
                e.reminderAt || '', e.reminderAt ? (e.reminderDone ? 'כן' : 'לא') : ''].map(cell).join(','));
  });
  lines.push('');
  lines.push(['—— סיכום ——'].map(cell).join(','));
  lines.push(['שם','טלפון','סכום','שולם','יתרה'].join(','));
  DB.payments.forEach(p => {
    lines.push([p.name, p.phone || '', Number(p.amount)||0, paidOf(p.id), balanceOf(p)].map(cell).join(','));
  });
  download('﻿' + lines.join('\r\n'), 'shkar-tirha-' + todayKey() + '.csv', 'text/csv;charset=utf-8');
}
function exportJSON(){
  download(JSON.stringify(DB, null, 2), 'fee-backup-' + todayKey() + '.json', 'application/json');
}
function download(text, name, type){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type}));
  a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast('הקובץ ירד');
}

/* ==================================================================
   14. SETTINGS
   ================================================================== */
function viewSettings(){
  let h = '<a class="back" onclick="go(\'list\')">→ חזרה</a>';
  h += '<div class="card"><h2><span class="bar"></span>סנכרון בין מכשירים</h2>';
  h += syncUrl
    ? '<div class="okbox">הסנכרון פעיל. הנתונים בענן <b>מוצפנים</b> — בלי הסיסמה אי אפשר לקרוא אותם.</div>'
    : '<div class="warnbox">כרגע הנתונים נשמרים <b>רק במכשיר הזה</b>. כדי לראות אותם גם מהטלפון, הפעילי סנכרון.</div>';
  h += fld('כתובת הסנכרון', '<input type="text" id="s_url" dir="ltr" placeholder="https://api.npoint.io/..." value="' + esc(syncUrl) + '">');
  h += '<div class="btnbar"><button class="btn sm" onclick="saveSyncUrl()">שמירה</button>' +
       (syncUrl ? '<button class="btn sm sec" onclick="pullNow()">משיכה מהענן עכשיו</button>' : '') + '</div>';
  h += '<div class="hint" style="margin-top:10px"><b>איך יוצרים כתובת:</b><br>' +
       '1. נכנסים ל־<a href="https://www.npoint.io" target="_blank" rel="noopener">npoint.io</a><br>' +
       '2. מדביקים בתיבה <span dir="ltr">{}</span> ולוחצים Save<br>' +
       '3. מעתיקים את הכתובת שנוצרה ומדביקים כאן<br>' +
       '4. במכשיר השני — אותה כתובת, אותה סיסמה</div></div>';

  const notifyOn = !!(DB.settings && DB.settings.notify);
  h += '<div class="card"><h2><span class="bar"></span>התראות</h2>' +
    '<div class="warnbox">אתר לא יכול להתריע כשהוא סגור. תזכורות תמיד מחכות בראש מסך התשלומים ' +
    'ובלשונית 🔔, ובנוסף אפשר התראת דפדפן כשהאתר פתוח.</div>' +
    '<div class="switch" onclick="if(event.target.tagName!==\'INPUT\'){var b=document.getElementById(\'s_notify\');b.checked=!b.checked;saveNotify();}">' +
    '<input type="checkbox" id="s_notify"' + (notifyOn ? ' checked' : '') + ' onchange="saveNotify()">' +
    '<label for="s_notify">התראת דפדפן כשיש תזכורת שהגיע זמנה</label></div></div>';

  h += '<div class="card"><h2><span class="bar"></span>סיסמה</h2>' +
    '<div class="hint" style="margin-bottom:10px">שינוי הסיסמה מצפין מחדש את כל הנתונים. ' +
    'אם יש סנכרון — תצטרכי להזין את הסיסמה החדשה גם במכשירים האחרים.</div>' +
    '<div class="btnbar"><button class="btn sm sec" onclick="changePassModal()">שינוי סיסמה</button>' +
    '<button class="btn sm sec" onclick="lockNow()">נעילה</button></div></div>';

  h += '<div class="card"><h2><span class="bar"></span>גיבוי ושחזור</h2>' +
    '<div class="btnbar"><button class="btn sm sec" onclick="exportJSON()">הורדת גיבוי</button>' +
    '<button class="btn sm sec" onclick="$(\'impFile\').click()">שחזור מגיבוי</button></div>' +
    '<input type="file" id="impFile" accept=".json" class="hide" onchange="importJSON(this)">' +
    '<div class="hint">מומלץ להוריד גיבוי פעם בחודש.</div></div>';

  h += '<div class="card"><h2><span class="bar"></span>נתונים</h2>' +
    '<div class="kv"><span class="muted">תשלומים</span><b>' + DB.payments.length + '</b></div>' +
    '<div class="kv"><span class="muted">שורות ביומן</span><b>' + DB.entries.length + '</b></div>' +
    '<div class="kv"><span class="muted">עדכון אחרון</span><b>' +
      new Date(DB.updatedAt).toLocaleString('he-IL') + '</b></div>' +
    '<div class="btnbar" style="margin-top:12px">' +
    '<button class="btn sm dang" onclick="wipe()">מחיקת כל הנתונים</button></div></div>';
  return h;
}
async function saveSyncUrl(){
  syncUrl = $('s_url').value.trim();
  localStorage.setItem(LS_SYNC, syncUrl);
  await save(); render();
  toast(syncUrl ? 'סנכרון הופעל' : 'סנכרון בוטל');
}
async function pullNow(){
  try{
    const blob = await fetchRemote();
    if(!blob) return toast('אין נתונים בענן');
    DB = migrate(await decryptDB(blob, KEY));
    localStorage.setItem(LS_BLOB, JSON.stringify(blob));
    setSync('ok', '☁️ מסונכרן');
    render(); toast('הנתונים עודכנו מהענן');
  } catch(e){
    toast(e.name === 'OperationError' ? 'הסיסמה בענן שונה' : 'שגיאה במשיכה');
  }
}
async function saveNotify(){
  const on = $('s_notify').checked;
  if(on && 'Notification' in window && Notification.permission !== 'granted'){
    const p = await Notification.requestPermission();
    if(p !== 'granted'){ $('s_notify').checked = false; return toast('הדפדפן חסם התראות'); }
  }
  DB.settings.notify = on;
  await save(); toast(on ? 'התראות הופעלו' : 'התראות בוטלו');
}
function changePassModal(){
  modal('שינוי סיסמה',
    '<div class="warnbox">אם תשכחי את הסיסמה החדשה — לא תהיה דרך לשחזר את הנתונים. ' +
    'מומלץ להוריד גיבוי לפני השינוי.</div>' +
    fld('סיסמה חדשה', '<input type="password" id="np1">') +
    fld('אימות', '<input type="password" id="np2">') +
    '<button class="btn full" onclick="doChangePass()">שינוי</button>');
}
async function doChangePass(){
  const a = $('np1').value, b = $('np2').value;
  if(a.length < 4) return toast('סיסמה קצרה מדי');
  if(a !== b) return toast('הסיסמאות אינן זהות');
  SALT = crypto.getRandomValues(new Uint8Array(16));
  KEY = await deriveKey(a, SALT);
  if(localStorage.getItem(LS_PASS) !== null) localStorage.setItem(LS_PASS, a);
  closeModal(); await save(); toast('הסיסמה שונתה');
}
function lockNow(){ localStorage.removeItem(LS_PASS); location.reload(); }
async function importJSON(input){
  const f = input.files[0]; if(!f) return;
  try{
    const obj = JSON.parse(await f.text());
    if(!obj || !(Array.isArray(obj.payments) || Array.isArray(obj.clients))) throw new Error('bad');
    if(!confirm('השחזור יחליף את כל הנתונים הקיימים. להמשיך?')) return;
    DB = migrate(obj);
    await save(); go('list'); toast('שוחזר בהצלחה');
  } catch(e){ toast('קובץ לא תקין'); }
  input.value = '';
}
async function wipe(){
  if(!confirm('פעולה זו תמחק את כל התשלומים והשורות. להמשיך?')) return;
  if(!confirm('בטוחה? אין דרך חזרה (אלא אם יש לך גיבוי).')) return;
  DB = freshDB(); await save(); go('list'); toast('הכל נמחק');
}

/* ==================================================================
   15. MODAL
   ================================================================== */
function fld(label, inner){ return '<div class="fld"><label>' + label + '</label>' + inner + '</div>'; }
function modal(title, body){
  $('modalHost').innerHTML =
    '<div class="modal" onclick="if(event.target===this)closeModal()"><div class="modal-in">' +
    '<div class="modal-h"><h3>' + esc(title) + '</h3><button class="x" onclick="closeModal()">×</button></div>' +
    body + '</div></div>';
}
function closeModal(){ $('modalHost').innerHTML = ''; }

/* ==================================================================
   16. UNLOCK
   ================================================================== */
let mode = 'unlock', bootBlob = null;

async function boot(){
  syncUrl = localStorage.getItem(LS_SYNC) || '';
  bootBlob = localBlob();
  if(syncUrl){
    try { const r = await fetchRemote(); if(r) bootBlob = r; } catch(e){ /* offline */ }
  }
  mode = bootBlob ? 'unlock' : 'setup';
  $('lockSub').innerHTML = mode === 'setup'
    ? 'ברוכה הבאה. בחרי סיסמה שתגן על הנתונים.<br>הנתונים מוצפנים — רק הסיסמה הזו פותחת אותם.'
    : 'הזיני את הסיסמה שלך';
  $('pass2').classList.toggle('hide', mode !== 'setup');
  $('lockGo').textContent = mode === 'setup' ? 'יצירת המערכת' : 'כניסה';
  $('lockNote').innerHTML = mode === 'setup'
    ? '<b>חשוב לדעת:</b> אין "שכחתי סיסמה". הסיסמה לא נשמרת בשום שרת, ולכן אם היא תאבד — הנתונים לא ניתנים לשחזור. רשמי אותה במקום בטוח.'
    : '';
  $('lockForm').classList.remove('hide');

  const saved = localStorage.getItem(LS_PASS);
  if(saved && mode === 'unlock'){
    $('remember').checked = true; $('pass1').value = saved; tryUnlock(true);
  } else $('pass1').focus();
}

async function tryUnlock(silent){
  const p1 = $('pass1').value, err = $('lockErr');
  err.textContent = '';

  if(mode === 'setup'){
    if(p1.length < 4) return err.textContent = 'הסיסמה צריכה להיות באורך 4 תווים לפחות';
    if(p1 !== $('pass2').value) return err.textContent = 'הסיסמאות אינן זהות';
    SALT = crypto.getRandomValues(new Uint8Array(16));
    KEY = await deriveKey(p1, SALT);
    DB = freshDB();
    if($('remember').checked) localStorage.setItem(LS_PASS, p1);
    await save();
    return enterApp();
  }

  if(!p1) return err.textContent = 'הזיני סיסמה';
  $('lockGo').disabled = true; $('lockGo').textContent = 'פותח…';
  try{
    SALT = unb64(bootBlob.salt);
    KEY = await deriveKey(p1, SALT);
    DB = await decryptDB(bootBlob, KEY);

    const local = localBlob();
    if(local && local !== bootBlob){
      try{
        const lDB = await decryptDB(local, KEY);
        if(lDB.updatedAt > DB.updatedAt){ DB = lDB; dirty = true; }
      } catch(e){ /* local copy uses an older password — ignore */ }
    }

    const wasOld = DB.v !== 3;
    DB = migrate(DB);
    if(!DB.settings) DB.settings = {notify:false};

    if($('remember').checked) localStorage.setItem(LS_PASS, p1);
    else localStorage.removeItem(LS_PASS);
    localStorage.setItem(LS_BLOB, JSON.stringify(bootBlob));
    enterApp();
    if(wasOld){ await save(); toast('הנתונים הומרו למבנה החדש'); }
    else if(dirty) save();
  } catch(e){
    localStorage.removeItem(LS_PASS);
    err.textContent = 'סיסמה שגויה';
    $('pass1').value = '';
    if(!silent) $('pass1').focus();
  }
  $('lockGo').disabled = false;
  $('lockGo').textContent = mode === 'setup' ? 'יצירת המערכת' : 'כניסה';
}

function enterApp(){
  $('lock').classList.add('hide');
  $('app').classList.remove('hide');
  setSync(syncUrl ? 'ok' : '', syncUrl ? '☁️ מסונכרן' : '💾 מקומי — הפעילי סנכרון בהגדרות');
  go('list');
  const due = dueReminders();
  if(due.length && DB.settings.notify && 'Notification' in window && Notification.permission === 'granted'){
    try{ new Notification('מעקב שכר טרחה', {body: due.length + ' תזכורות מחכות לך'}); } catch(e){}
  }
}

$('lockGo').onclick = () => tryUnlock(false);
['pass1','pass2'].forEach(id => $(id).addEventListener('keydown', e => {
  if(e.key === 'Enter') tryUnlock(false);
}));

boot();
</script>
