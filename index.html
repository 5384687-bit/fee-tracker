<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#1e3a5f">
<title>מעקב שכר טרחה</title>
<style>
:root{
  --bg1:#f2f4fb; --bg2:#fdf8f3;
  --card:#ffffff; --ink:#22283a; --ink2:#6b7391; --ink3:#a3aac4;
  --line:#e8eaf4;
  --brand:#4a5da8; --brand-dk:#3a4a8a; --brand-lt:#eef1fb;
  --gold:#e0a33c; --gold-lt:#fdf3e2;
  --ok:#12a06a; --ok-lt:#e6f7f0;
  --warn:#e08a1e; --warn-lt:#fdf2e0;
  --bad:#e2455b; --bad-lt:#fdecef;
  --sh-s:0 1px 2px rgba(34,40,58,.05), 0 2px 6px rgba(34,40,58,.05);
  --sh-m:0 2px 6px rgba(34,40,58,.06), 0 8px 20px rgba(34,40,58,.07);
  --r-m:16px; --r-l:22px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
html{font-family:'Segoe UI',Tahoma,'Noto Sans Hebrew',Arial,sans-serif}
*{font-family:inherit}
body{
  background:var(--bg1);
  background-image:
    radial-gradient(1100px 520px at 100% -8%, #e8ecfb 0%, rgba(232,236,251,0) 60%),
    radial-gradient(900px 460px at 0% 4%, var(--bg2) 0%, rgba(253,248,243,0) 62%);
  background-attachment:fixed;
  color:var(--ink); font-size:18px; line-height:1.6;
  padding-bottom:92px; -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:var(--brand);cursor:pointer;text-decoration:none}
.hide{display:none !important}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}

/* ---------------- lock ---------------- */
#lock{position:fixed;inset:0;z-index:100;overflow-y:auto;padding:22px;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(155deg,#4a5da8 0%,#36407a 45%,#232a4f 100%)}
#lock:before{content:'';position:absolute;inset:0;
  background:radial-gradient(600px 300px at 80% 10%, rgba(224,163,60,.22), transparent 65%)}
.lockbox{position:relative;background:#fff;border-radius:26px;padding:34px 27px;
  width:100%;max-width:395px;box-shadow:0 30px 70px rgba(15,20,45,.45);text-align:center;
  animation:pop .3s ease both}
.lockbox .emblem{width:66px;height:66px;margin:0 auto 14px;border-radius:20px;
  background:linear-gradient(145deg,var(--brand),#36407a);color:#fff;font-size:38px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 10px 22px rgba(74,93,168,.38)}
.lockbox h1{margin:0 0 7px;font-size:27px;font-weight:800;letter-spacing:-.3px}
.lockbox .sub{color:var(--ink2);font-size:16px;margin-bottom:22px;line-height:1.65}
.lockbox input{width:100%;padding:15px 16px;border:2px solid var(--line);border-radius:15px;
  margin-bottom:11px;text-align:center;font-size:20px;background:#fbfcfe;transition:.18s}
.lockbox input:focus{outline:none;border-color:var(--brand);background:#fff;
  box-shadow:0 0 0 4px rgba(74,93,168,.13)}
.lockbox .go{width:100%;padding:16px;border-radius:15px;font-weight:800;font-size:20px;color:#fff;
  background:linear-gradient(135deg,var(--brand),#36407a);
  box-shadow:0 8px 20px rgba(74,93,168,.35);transition:.16s}
.lockbox .go:active{transform:translateY(1px);box-shadow:0 4px 12px rgba(74,93,168,.3)}
.lockerr{color:var(--bad);font-size:16px;min-height:20px;margin-top:9px;font-weight:600}
.lockrow{display:flex;align-items:center;gap:8px;justify-content:center;font-size:16px;
  color:var(--ink2);margin:13px 0 2px}
.lockrow input{width:auto;margin:0;accent-color:var(--brand)}
.locknote{font-size:14px;color:var(--ink3);margin-top:18px;line-height:1.7;
  border-top:1px solid var(--line);padding-top:15px;text-align:right}

/* ---------------- header ---------------- */
header{position:sticky;top:0;z-index:20;padding:17px 18px 15px;color:#fff;
  background:linear-gradient(135deg,#4a5da8 0%,#3a4a8a 55%,#333f75 100%);
  border-radius:0 0 24px 24px;box-shadow:0 6px 22px rgba(58,74,138,.28)}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
header h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.2px}
header h1 span{color:#f7cf8a}
.hbtn{color:#fff;font-size:20px;width:38px;height:38px;border-radius:12px;
  background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;transition:.16s}
.hbtn:active{background:rgba(255,255,255,.28)}
.sync{font-size:14px;font-weight:600;padding:6px 13px;border-radius:20px;margin-top:11px;
  display:inline-block;color:#fff;background:rgba(255,255,255,.16);transition:.16s}
.sync:active{background:rgba(255,255,255,.3)}
.sync.ok{background:rgba(18,160,106,.4)}
.sync.err{background:rgba(226,69,91,.42)}
.sync.warn{background:rgba(224,138,30,.42)}

/* ---------------- layout ---------------- */
main{max-width:980px;margin:0 auto;padding:18px 14px 22px;animation:fadeUp .28s ease both}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-l);
  padding:18px;margin-bottom:15px;box-shadow:var(--sh-s)}
.card h2{margin:0 0 15px;font-size:20px;font-weight:800;display:flex;align-items:center;gap:9px}
.card h2 .bar{width:5px;height:19px;border-radius:4px;
  background:linear-gradient(180deg,var(--gold),#c9862a)}
.card h2 .cnt{font-size:14px;background:var(--brand-lt);color:var(--brand);
  padding:3px 10px;border-radius:20px;font-weight:800}
.card.alert{border-color:#f6d9ae;background:linear-gradient(170deg,#fffaf1,#fff)}
.card.alert h2 .bar{background:linear-gradient(180deg,var(--warn),#c9761a)}
.muted{color:var(--ink2)}
.empty{text-align:center;color:var(--ink3);padding:30px 12px;font-size:16px;line-height:1.7}

/* ---------------- hero summary ---------------- */
.hero{position:relative;overflow:hidden;border-radius:var(--r-l);padding:22px 20px;
  margin-bottom:15px;color:#fff;box-shadow:var(--sh-m);
  background:linear-gradient(135deg,#4a5da8,#3a4a8a 60%,#2f3a6e)}
.hero.clear{background:linear-gradient(135deg,#12a06a,#0d8659 65%,#0a6d49)}
.hero:before{content:'';position:absolute;top:-55px;left:-35px;width:190px;height:190px;
  border-radius:50%;background:rgba(255,255,255,.09)}
.hero:after{content:'';position:absolute;bottom:-70px;left:35px;width:130px;height:130px;
  border-radius:50%;background:rgba(255,255,255,.06)}
.hero .inner{position:relative;display:flex;align-items:center;gap:16px}
.hero .num{font-size:62px;font-weight:800;line-height:.95;letter-spacing:-2px}
.hero .txt .l1{font-size:20px;font-weight:700}
.hero .txt .l2{font-size:16px;opacity:.82;margin-top:4px}
.hero .chip2{position:relative;margin-top:15px;display:inline-flex;align-items:center;gap:7px;
  background:rgba(255,255,255,.17);border-radius:14px;padding:9px 14px;font-size:16px;font-weight:600}

/* ---------------- rows ---------------- */
.row{display:flex;align-items:flex-start;gap:12px;padding:14px 10px;
  border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.row .grow{flex:1;min-width:0}
.row .nm{font-weight:700;font-size:18px}
.row .meta{font-size:14px;color:var(--ink2);margin-top:4px;line-height:1.6}
.row .amt{font-weight:800;white-space:nowrap;font-size:20px;text-align:left}
.clickable{cursor:pointer;border-radius:14px;transition:background .15s,transform .1s}
.clickable:hover{background:#f7f8fd}
.clickable:active{transform:scale(.994)}
.tel{color:var(--brand)}

/* ---------------- timeline ---------------- */
.tl{position:relative;padding-right:26px}
.tl:before{content:'';position:absolute;top:10px;bottom:10px;right:7px;width:2.5px;
  border-radius:2px;background:linear-gradient(180deg,var(--line),#f0f2f9)}
.ent{position:relative;padding:14px 15px;margin-bottom:11px;background:#fff;
  border:1px solid var(--line);border-radius:var(--r-m);box-shadow:var(--sh-s)}
.ent:before{content:'';position:absolute;right:-24px;top:19px;width:13px;height:13px;
  border-radius:50%;background:var(--ink3);border:3px solid #fff;
  box-shadow:0 0 0 2px var(--line)}
.ent.money{border-color:#c7ecdb;background:linear-gradient(170deg,#f4fcf8,#fff)}
.ent.money:before{background:var(--ok);box-shadow:0 0 0 2px #c7ecdb}
.ent.rem{border-color:#f7ddb2}
.ent.rem:before{background:var(--warn);box-shadow:0 0 0 2px #f7ddb2}
.ent .top{display:flex;justify-content:space-between;gap:11px;align-items:flex-start}
.ent .dt{font-size:14px;color:var(--ink3);font-weight:700;letter-spacing:.2px}
.ent .txt{font-size:18px;margin-top:4px;white-space:pre-line;word-break:break-word}
.ent .sum{font-weight:800;color:var(--ok);white-space:nowrap;font-size:20px}
.ent .rembox{margin-top:9px;font-size:14px;background:var(--warn-lt);color:#96601a;
  border-radius:11px;padding:8px 11px;font-weight:600;line-height:1.5}
.ent .rembox.due{background:var(--bad-lt);color:#b32b42}
.ent .acts{margin-top:11px;display:flex;gap:7px;flex-wrap:wrap}
.ent .acts button{font-size:14px;font-weight:600;color:var(--ink2);padding:6px 11px;
  border-radius:10px;background:#f3f5fb;transition:.15s}
.ent .acts button:hover{background:var(--brand-lt);color:var(--brand)}
.ent .acts button.dl:hover{background:var(--bad-lt);color:var(--bad)}

/* ---------------- badges ---------------- */
.badge{display:inline-block;font-size:14px;padding:4px 11px;border-radius:20px;
  font-weight:700;white-space:nowrap}
.b-ok{background:var(--ok-lt);color:var(--ok)}
.b-late{background:var(--bad-lt);color:var(--bad)}
.b-soon{background:var(--warn-lt);color:#96601a}

/* ---------------- buttons ---------------- */
.btn{padding:13px 22px;border-radius:15px;font-weight:800;font-size:18px;color:#fff;
  display:inline-flex;align-items:center;gap:8px;justify-content:center;
  background:linear-gradient(135deg,var(--brand),#3a4a8a);
  box-shadow:0 5px 14px rgba(74,93,168,.32);transition:.16s;letter-spacing:-.1px}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(1.5px);box-shadow:0 2px 7px rgba(74,93,168,.3)}
.btn.sec{background:#fff;color:var(--brand);border:2px solid var(--brand-lt);
  box-shadow:var(--sh-s)}
.btn.sec:hover{background:var(--brand-lt)}
.btn.ok{background:linear-gradient(135deg,#14b478,var(--ok));
  box-shadow:0 5px 14px rgba(18,160,106,.32)}
.btn.dang{background:#fff;color:var(--bad);border:2px solid var(--bad-lt);box-shadow:var(--sh-s)}
.btn.dang:hover{background:var(--bad-lt)}
.btn.sm{padding:9px 15px;font-size:16px;border-radius:12px;box-shadow:none}
.btn.sm:active{transform:translateY(1px)}
.btn.full{width:100%}
.btn:disabled{opacity:.5;cursor:default;box-shadow:none;transform:none}
.btnbar{display:flex;gap:9px;flex-wrap:wrap}
.fab{position:fixed;bottom:98px;left:16px;z-index:25;padding:16px 24px;border-radius:30px;
  color:#fff;font-weight:800;font-size:18px;
  background:linear-gradient(135deg,var(--gold),#c9862a);
  box-shadow:0 10px 26px rgba(201,134,42,.46);transition:.16s}
.fab:active{transform:translateY(2px) scale(.985);box-shadow:0 5px 14px rgba(201,134,42,.4)}

/* ---------------- forms ---------------- */
label{display:block;font-size:16px;font-weight:700;color:var(--ink2);margin:0 0 7px}
.fld{margin-bottom:15px}
input[type=text],input[type=number],input[type=date],input[type=tel],
input[type=password],select,textarea{width:100%;padding:13px 15px;border:2px solid var(--line);
  border-radius:14px;background:#fbfcfe;transition:.18s;font-size:18px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);background:#fff;
  box-shadow:0 0 0 4px rgba(74,93,168,.12)}
textarea{resize:vertical;min-height:74px;line-height:1.6}
input[type=date],input[type=number],input[type=tel]{direction:ltr;text-align:right}
input::placeholder,textarea::placeholder{color:var(--ink3)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:10px 16px;border-radius:22px;border:2px solid var(--line);background:#fff;
  font-size:16px;font-weight:700;color:var(--ink2);transition:.16s}
.chip:hover{border-color:#cfd6ee}
.chip.on{background:linear-gradient(135deg,var(--brand),#3a4a8a);color:#fff;
  border-color:transparent;box-shadow:0 4px 11px rgba(74,93,168,.3)}
.switch{display:flex;align-items:center;gap:11px;padding:14px 15px;
  background:var(--gold-lt);border:2px solid #f4dfb8;border-radius:15px;
  margin-bottom:15px;cursor:pointer;transition:.16s}
.switch:hover{background:#fceed6}
.switch input{width:21px;height:21px;margin:0;accent-color:var(--brand)}
.switch label{margin:0;font-weight:700;color:var(--ink);cursor:pointer;font-size:18px}

/* ---------------- modal ---------------- */
.modal{position:fixed;inset:0;background:rgba(24,29,50,.55);z-index:60;
  display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px);
  animation:pop .18s ease both}
.modal-in{background:#fff;border-radius:26px 26px 0 0;width:100%;max-width:640px;
  max-height:93vh;overflow-y:auto;padding:8px 18px calc(24px + env(safe-area-inset-bottom));
  box-shadow:0 -12px 44px rgba(24,29,50,.28)}
.modal-in:before{content:'';display:block;width:44px;height:5px;border-radius:3px;
  background:var(--line);margin:8px auto 4px}
@media(min-width:700px){.modal{align-items:center;padding:22px}
  .modal-in{border-radius:24px;max-height:88vh}
  .modal-in:before{display:none}}
.modal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:17px;
  position:sticky;top:0;background:#fff;padding:12px 0 11px;z-index:2}
.modal-h h3{margin:0;font-size:23px;font-weight:800}
.x{font-size:27px;color:var(--ink3);width:36px;height:36px;border-radius:11px;
  background:#f3f5fb;display:flex;align-items:center;justify-content:center;line-height:1}
.x:active{background:var(--line)}

/* ---------------- nav ---------------- */
nav{position:fixed;bottom:0;right:0;left:0;z-index:30;display:flex;gap:4px;
  padding:9px 10px calc(9px + env(safe-area-inset-bottom));
  background:rgba(255,255,255,.94);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);box-shadow:0 -4px 22px rgba(34,40,58,.08)}
nav button{flex:1;padding:9px 2px 8px;font-size:14px;font-weight:700;color:var(--ink3);
  display:flex;flex-direction:column;align-items:center;gap:4px;
  border-radius:15px;position:relative;transition:.18s}
nav button .ic{font-size:23px;line-height:1;transition:transform .18s}
nav button.on{color:var(--brand);background:var(--brand-lt)}
nav button.on .ic{transform:translateY(-1px) scale(1.08)}
nav .dot{position:absolute;top:5px;left:50%;margin-left:10px;width:9px;height:9px;
  border-radius:50%;background:var(--bad);border:2px solid #fff}

/* ---------------- misc ---------------- */
.search{margin-bottom:14px}
.progbar{height:9px;background:#eef0f8;border-radius:6px;overflow:hidden;margin-top:10px}
.progbar i{display:block;height:100%;border-radius:6px;
  background:linear-gradient(90deg,#12a06a,#4bd39b);transition:width .35s ease}
.kv{display:flex;justify-content:space-between;gap:11px;padding:11px 0;
  border-bottom:1px solid var(--line);font-size:16px}
.kv:last-child{border-bottom:none}
.kv b{font-weight:800}
.toast{position:fixed;bottom:100px;right:50%;transform:translateX(50%) translateY(8px);
  background:var(--ink);color:#fff;padding:13px 24px;border-radius:26px;font-size:16px;
  font-weight:600;z-index:90;box-shadow:0 10px 30px rgba(24,29,50,.4);
  opacity:0;transition:.25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(50%) translateY(0)}
.hint{font-size:14px;color:var(--ink3);line-height:1.7;margin-top:8px}
.warnbox{background:var(--warn-lt);border:1.5px solid #f4dfb8;border-radius:15px;
  padding:14px;font-size:16px;color:#8a5a12;line-height:1.7;margin-bottom:15px}
.okbox{background:var(--ok-lt);border:1.5px solid #bfe9d6;border-radius:15px;
  padding:14px;font-size:16px;color:#0a6d49;line-height:1.7;margin-bottom:15px}
.back{font-size:16px;color:var(--brand);font-weight:700;margin-bottom:13px;
  display:inline-flex;align-items:center;gap:5px;padding:7px 13px;border-radius:12px;
  background:#fff;border:1px solid var(--line);box-shadow:var(--sh-s)}
.head{position:relative;overflow:hidden;border-radius:var(--r-l);padding:22px 20px;
  margin-bottom:15px;color:#fff;box-shadow:var(--sh-m);
  background:linear-gradient(135deg,#4a5da8,#3a4a8a 60%,#2f3a6e)}
.head.done{background:linear-gradient(135deg,#12a06a,#0d8659 65%,#0a6d49)}
.head:before{content:'';position:absolute;top:-60px;left:-40px;width:200px;height:200px;
  border-radius:50%;background:rgba(255,255,255,.08)}
.head .nm{position:relative;font-size:27px;font-weight:800;letter-spacing:-.4px}
.head .ph{position:relative;font-size:16px;margin-top:5px}
.head .ph a{color:#fff;opacity:.9;font-weight:600}
.head .g3{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:18px}
.head .g3 div{background:rgba(255,255,255,.15);border-radius:15px;padding:12px 9px;text-align:center}
.head .g3 .l{font-size:14px;opacity:.8;font-weight:600}
.head .g3 .v{font-size:20px;font-weight:800;margin-top:3px;letter-spacing:-.3px}
.closedbar{position:relative;margin-top:15px;background:rgba(255,255,255,.2);
  border-radius:14px;padding:11px;text-align:center;font-size:16px;font-weight:700}
table.rep{width:100%;border-collapse:collapse;font-size:16px}
table.rep th{text-align:right;font-size:14px;color:var(--ink2);font-weight:800;
  padding:9px 7px;border-bottom:2px solid var(--line)}
table.rep td{padding:11px 7px;border-bottom:1px solid var(--line)}
table.rep tr:last-child td{border-bottom:none}
.bars{margin-top:6px}
.barrow{display:flex;align-items:center;gap:9px;margin-bottom:9px;font-size:16px}
.barrow .bl{width:60px;color:var(--ink2);font-weight:600;white-space:nowrap}
.barrow .bt{flex:1;height:24px;background:#eef0f8;border-radius:8px;overflow:hidden}
.barrow .bt i{display:block;height:100%;border-radius:8px;
  background:linear-gradient(90deg,var(--brand),#7387cc)}
.barrow .bv{width:78px;text-align:left;font-weight:700;white-space:nowrap}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}
@media(min-width:560px){.tiles{grid-template-columns:repeat(3,1fr)}}
@media(min-width:820px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{position:relative;overflow:hidden;background:#fff;border:1.5px solid var(--line);
  border-radius:18px;padding:14px 13px;box-shadow:var(--sh-s);transition:.16s}
.tile.tap{cursor:pointer}
.tile.tap:hover{border-color:#cfd6ee;transform:translateY(-2px);box-shadow:var(--sh-m)}
.tile.tap:active{transform:translateY(0) scale(.985)}
.tile .tname{font-size:18px;font-weight:800;line-height:1.3;word-break:break-word;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .tamt{font-size:23px;font-weight:800;margin-top:9px;letter-spacing:-.5px;line-height:1.1}
.tile .tsub{font-size:14px;color:var(--ink3);margin-top:3px;font-weight:600}
.tile.done{background:linear-gradient(165deg,#f2fbf7,#fff);border-color:#c7ecdb}
.tile.due{border-color:#f0b3bd;background:linear-gradient(165deg,#fff6f7,#fff)}
.tile .bell{position:absolute;top:11px;left:11px;font-size:16px}
.tile .tbar{height:7px;background:#eef0f8;border-radius:5px;overflow:hidden;margin-top:10px}
.tile .tbar i{display:block;height:100%;border-radius:5px;
  background:linear-gradient(90deg,#12a06a,#4bd39b);transition:width .35s ease}
.tile .mv{display:flex;gap:7px;margin-top:11px}
.tile .mv button{flex:1;padding:9px 0;border-radius:11px;background:#f1f3fa;
  font-size:16px;font-weight:800;color:var(--ink2);transition:.15s}
.tile .mv button:hover:not(:disabled){background:var(--brand-lt);color:var(--brand)}
.tile .mv button:disabled{opacity:.32;cursor:default}
.tile .pos{position:absolute;top:11px;right:13px;font-size:14px;font-weight:800;color:var(--ink3)}
.reorderbar{display:flex;align-items:center;gap:9px;background:var(--brand-lt);
  border:1.5px solid #d5ddf5;border-radius:15px;padding:12px 14px;margin-bottom:13px;
  font-size:14px;color:var(--brand);font-weight:700;line-height:1.5}
.syncbanner{background:linear-gradient(150deg,#fff8ec,#fff);border:2px solid #f4dfb8;
  border-radius:var(--r-l);padding:18px;margin-bottom:15px;box-shadow:var(--sh-s)}
.syncbanner .t{font-weight:800;font-size:18px;margin-bottom:6px}
.syncbanner .d{font-size:16px;color:var(--ink2);line-height:1.65;margin-bottom:14px}
</style>
</head>
<body>

<div id="lock">
  <div class="lockbox">
    <div class="emblem">⚖️</div>
    <h1>מעקב שכר טרחה</h1>
    <div class="sub" id="lockSub">טוען…</div>
    <div id="lockForm" class="hide">
      <input type="password" id="pass1" placeholder="סיסמה" autocomplete="current-password">
      <input type="password" id="pass2" class="hide" placeholder="אימות סיסמה" autocomplete="new-password">
      <button class="go" id="lockGo">כניסה</button>
      <div class="lockrow">
        <input type="checkbox" id="remember">
        <label for="remember" style="margin:0;font-weight:500;color:var(--ink2)">זכור אותי במכשיר הזה</label>
      </div>
      <div class="lockerr" id="lockErr"></div>
      <div class="locknote" id="lockNote"></div>
    </div>
  </div>
</div>

<div id="app" class="hide">
<header>
  <div class="hrow">
    <h1>מעקב <span>שכר טרחה</span></h1>
    <button class="hbtn" onclick="go('settings')" title="הגדרות">⚙️</button>
  </div>
  <button class="sync" id="syncStatus" onclick="go('settings')">☁️ מקומי בלבד</button>
</header>

<main id="view"></main>
<button class="fab hide" id="fab" onclick="editPayment()">＋ תשלום חדש</button>

<nav>
  <button data-nav="list"      onclick="go('list')"><span class="ic">💰</span>תשלומים</button>
  <button data-nav="reminders" onclick="go('reminders')"><span class="ic">🔔</span>תזכורות</button>
  <button data-nav="reports"   onclick="go('reports')"><span class="ic">📈</span>דוחות</button>
</nav>
</div>

<div id="modalHost"></div>
<div class="toast" id="toast"></div>

<script>
"use strict";

/* ==================================================================
   1. CONSTANTS
   ================================================================== */
const LS_BLOB = 'ft_blob', LS_SYNC = 'ft_sync', LS_PASS = 'ft_pass';
const PBKDF2_ITER = 250000;
const APP_VERSION = '2026.08.19d';
/* quick-pick phrases for the free-text content field */
const QUICK_TEXTS = ['התקבל תשלום','נשלחה דרישת תשלום','שיחה עם הלקוח','נשלח מייל','נחתם הסכם שכ״ט','הוגשה חשבונית'];

let DB = null, KEY = null, SALT = null;
let screen = 'list', curPay = null;
let syncUrl = '', dirty = false;

/* ==================================================================
   2. UTILITIES
   ================================================================== */
const $ = id => document.getElementById(id);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function money(n){
  const v = Math.round((Number(n) || 0) * 100) / 100;
  return '₪' + v.toLocaleString('he-IL', {maximumFractionDigits: 2});
}
function todayKey(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function heDate(key){
  if(!key) return '—';
  const [y,m,d] = key.split('-').map(Number);
  return new Date(y, m-1, d).toLocaleDateString('he-IL', {day:'numeric', month:'numeric', year:'2-digit'});
}
function heDateLong(key){
  if(!key) return '—';
  const [y,m,d] = key.split('-').map(Number);
  return new Date(y, m-1, d).toLocaleDateString('he-IL', {weekday:'short', day:'numeric', month:'long', year:'numeric'});
}
function daysUntil(key){
  if(!key) return 9999;
  const [y,m,d] = key.split('-').map(Number);
  const t = new Date(); t.setHours(0,0,0,0);
  return Math.round((new Date(y, m-1, d) - t) / 86400000);
}
function addDays(key, n){
  const [y,m,d] = key.split('-').map(Number);
  const dt = new Date(y, m-1, d + n);
  return dt.getFullYear() + '-' + String(dt.getMonth()+1).padStart(2,'0') + '-' + String(dt.getDate()).padStart(2,'0');
}
function toast(msg){
  const t = $('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ==================================================================
   3. CRYPTO
   ================================================================== */
const te = new TextEncoder(), td = new TextDecoder();
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function deriveKey(pass, salt){
  const base = await crypto.subtle.importKey('raw', te.encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    {name:'PBKDF2', salt, iterations:PBKDF2_ITER, hash:'SHA-256'},
    base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
async function encryptDB(obj, key, salt){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, te.encode(JSON.stringify(obj)));
  return {ft:1, alg:'AES-GCM-256', salt:b64(salt), iv:b64(iv), ct:b64(ct)};
}
async function decryptDB(blob, key){
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:unb64(blob.iv)}, key, unb64(blob.ct));
  return JSON.parse(td.decode(pt));
}
const isBlob = b => b && b.ft === 1 && b.ct && b.iv && b.salt;

/* ==================================================================
   4. STORAGE + SYNC
   ================================================================== */
function freshDB(){
  return {v:3, updatedAt:new Date().toISOString(),
          settings:{notify:false}, payments:[], entries:[]};
}
function localBlob(){
  try { return JSON.parse(localStorage.getItem(LS_BLOB)); } catch(e){ return null; }
}
async function fetchRemote(){
  if(!syncUrl) return null;
  const res = await fetch(syncUrl, {cache:'no-store'});
  if(!res.ok) throw new Error('HTTP ' + res.status);
  const j = await res.json();
  return isBlob(j) ? j : null;
}
async function pushRemote(blob){
  if(!syncUrl) return;
  const res = await fetch(syncUrl, {method:'POST', headers:{'Content-Type':'application/json'},
                                    body:JSON.stringify(blob)});
  if(!res.ok) throw new Error('HTTP ' + res.status);
}
function setSync(state, text){
  const el = $('syncStatus');
  el.className = 'sync' + (state ? ' ' + state : '');
  el.textContent = text;
}
/** A card closes itself the moment nothing is owed on it, and reopens if the
    amount is later raised. Returns the names that closed on this pass. */
function applyAutoClose(){
  normalizeOrder();
  const justClosed = [];
  DB.payments.forEach(p => {
    const amt = Number(p.amount) || 0;
    const settled = amt > 0 && balanceOf(p) <= 0.5;
    if(settled && !p.closed){
      p.closed = true;
      p.closedAt = todayKey();
      /* chasing a paid client is noise — retire its open reminders too */
      DB.entries.forEach(e => {
        if(e.paymentId === p.id && e.reminderAt && !e.reminderDone) e.reminderDone = true;
      });
      justClosed.push(p.name);
    } else if(!settled && p.closed){
      p.closed = false;
      p.closedAt = null;
    }
  });
  return justClosed;
}

async function save(){
  if(!DB || !KEY) return [];
  const justClosed = applyAutoClose();
  DB.updatedAt = new Date().toISOString();
  const blob = await encryptDB(DB, KEY, SALT);
  try { localStorage.setItem(LS_BLOB, JSON.stringify(blob)); }
  catch(e){ toast('שגיאה בשמירה מקומית'); }
  if(!syncUrl){ setSync('', '💾 מקומי בלבד — הקישי להפעלת סנכרון'); return justClosed; }
  setSync('warn', '☁️ מסנכרן…');
  try { await pushRemote(blob); dirty = false; setSync('ok', '☁️ מסונכרן'); }
  catch(e){ dirty = true; setSync('err', '⚠️ אין חיבור — נשמר במכשיר, יסונכרן בהמשך'); }
  return justClosed;
}
setInterval(() => { if(dirty && syncUrl && navigator.onLine) save(); }, 30000);
window.addEventListener('online', () => { if(dirty) save(); });

/* ==================================================================
   5. MIGRATION  ->  v3 (one flat list of payments)
   ================================================================== */
function migrate(db){
  if(!db || db.v === 3) return db;
  const out = freshDB();
  out.settings.notify = !!(db.settings && db.settings.notify);
  const rate = ((db.settings && db.settings.vatRate != null) ? db.settings.vatRate : 18) / 100;

  if(db.v === 2){
    /* v2: clients carrying a fee + entries keyed by clientId */
    out.payments = (db.clients || []).map(c => ({
      id: c.id, name: c.name, phone: c.phone || '',
      /* fold VAT into a single final amount — v3 has no separate VAT field */
      amount: Math.round((c.vatMode === 'plus' ? (Number(c.feeAmount)||0) * (1 + rate)
                                               : (Number(c.feeAmount)||0)) * 100) / 100,
      notes: c.notes || '', createdAt: c.createdAt || todayKey()
    }));
    out.entries = (db.entries || []).map(e => Object.assign({}, e, {paymentId: e.clientId}));
    out.entries.forEach(e => { delete e.clientId; });
    return out;
  }

  /* v1: clients + matters + payments */
  const byClient = {};
  (db.clients || []).forEach(c => {
    byClient[c.id] = {id:c.id, name:c.name, phone:c.phone || '', amount:0,
                      notes:c.notes || '', createdAt:c.createdAt || todayKey()};
  });
  (db.matters || []).forEach(m => {
    const p = byClient[m.clientId]; if(!p) return;
    const base = Number(m.feeAmount) || 0;
    p.amount += (m.vatMode === 'plus' ? base * (1 + rate) : base);
    if(m.title) p.notes = ((p.notes ? p.notes + '\n' : '') + m.title).trim();
  });
  (db.payments || []).forEach(p => {
    const m = (db.matters || []).find(x => x.id === p.matterId);
    if(!m || !byClient[m.clientId]) return;
    const paid = p.status === 'paid';
    out.entries.push({
      id: p.id || uid(), paymentId: m.clientId,
      date: (paid ? p.paidDate : p.dueDate) || todayKey(),
      content: [p.notes, m.title, paid ? p.method : (p.status === 'cancelled' ? 'בוטל' : 'תשלום מתוכנן'),
                p.receiptNo ? 'קבלה ' + p.receiptNo : ''].filter(Boolean).join(' · '),
      amount: paid ? (Number(p.amount) || 0) : 0,
      reminderAt: (!paid && p.status === 'pending') ? (p.dueDate || null) : null,
      reminderDone: false, createdAt: p.createdAt || todayKey()
    });
  });
  out.payments = Object.values(byClient).map(p =>
    Object.assign(p, {amount: Math.round(p.amount * 100) / 100}));
  return out;
}

/* ==================================================================
   6. DOMAIN
   ================================================================== */
const payById = id => DB.payments.find(p => p.id === id);

/** Give every card a place in the manual order, seeding from the old
    balance-first arrangement the first time so nothing jumps around. */
function normalizeOrder(){
  if(DB.payments.every(p => typeof p.order === 'number')) return;
  DB.payments.slice()
    .sort((a,b) => balanceOf(b) - balanceOf(a))
    .forEach((p,i) => { p.order = i; });
}
/** The cards currently on screen, in the order they are drawn. */
function visiblePayments(){
  let list = DB.payments.slice();
  if(listFilter === 'open') list = list.filter(p => !p.closed);
  if(listFilter === 'paid') list = list.filter(p => p.closed);
  const q = listQ.trim();
  if(q) list = list.filter(p => (p.name + ' ' + (p.phone||'')).includes(q));
  return list.sort((a,b) => (a.order||0) - (b.order||0));
}
/** Swap a card with its neighbour on screen, so filters and search stay honest. */
async function movePayment(id, dir){
  const vis = visiblePayments();
  const i = vis.findIndex(p => p.id === id);
  const j = i + dir;
  if(i < 0 || j < 0 || j >= vis.length) return;
  const t = vis[i].order; vis[i].order = vis[j].order; vis[j].order = t;
  await save();
  render();
}
const payName = id => { const p = payById(id); return p ? p.name : '—'; };

const payEntries = id => DB.entries.filter(e => e.paymentId === id)
  .sort((a,b) => (a.date === b.date ? String(b.createdAt||'').localeCompare(String(a.createdAt||''))
                                    : (a.date < b.date ? 1 : -1)));
/** How much has actually come in against this payment. */
const paidOf = id => DB.entries.filter(e => e.paymentId === id)
  .reduce((s,e) => s + (Number(e.amount) || 0), 0);
const balanceOf = p => (Number(p.amount) || 0) - paidOf(p.id);

/** What pops up with a reminder: its own text, or the row's content as a fallback. */
const remMsg = e => (e.reminderText && e.reminderText.trim()) || e.content || 'תזכורת';

function dueReminders(){
  return DB.entries.filter(e => e.reminderAt && !e.reminderDone && daysUntil(e.reminderAt) <= 0)
    .sort((a,b) => a.reminderAt < b.reminderAt ? -1 : 1);
}
function upcomingReminders(){
  return DB.entries.filter(e => e.reminderAt && !e.reminderDone && daysUntil(e.reminderAt) > 0)
    .sort((a,b) => a.reminderAt < b.reminderAt ? -1 : 1);
}

/* ==================================================================
   7. ROUTER
   ================================================================== */
function go(s, id){
  screen = s;
  if(s === 'pay') curPay = id;
  window.scrollTo(0, 0);
  render();
}
function render(){
  const navMap = {pay:'list'};
  document.querySelectorAll('nav button').forEach(b => {
    b.classList.toggle('on', b.dataset.nav === (navMap[screen] || screen));
    const old = b.querySelector('.dot'); if(old) old.remove();
  });
  if(DB && dueReminders().length){
    const btn = document.querySelector('nav button[data-nav="reminders"]');
    if(btn){ const d = document.createElement('span'); d.className = 'dot'; btn.appendChild(d); }
  }
  /* the floating add button belongs only to the main list */
  $('fab').classList.toggle('hide', screen !== 'list');
  const fn = {list:viewList, pay:viewPay, reminders:viewReminders,
              reports:viewReports, settings:viewSettings}[screen];
  $('view').innerHTML = fn ? fn() : '';
}

/* ==================================================================
   8. MAIN LIST — everything revolves around payments
   ================================================================== */
let listQ = '', listFilter = 'open', reorderMode = false;
function toggleReorder(){ reorderMode = !reorderMode; render(); }
function viewList(){
  const openPays = DB.payments.filter(p => !p.closed);
  const openBalance = openPays.reduce((s,p) => s + Math.max(0, balanceOf(p)), 0);
  const n = openPays.length;

  let h = '';
  if(DB.payments.length){
    h += '<div class="hero' + (n === 0 ? ' clear' : '') + '"><div class="inner">' +
      '<div class="num">' + n + '</div>' +
      '<div class="txt"><div class="l1">' +
        (n === 0 ? 'הכל נסגר 🎉'
                 : n === 1 ? 'תשלום אחד עדיין פתוח'
                           : 'תשלומים עדיין פתוחים') + '</div>' +
      '<div class="l2">' +
        (n === 0 ? 'אין מה לגבות כרגע'
                 : 'נותרו לגבייה ' + money(openBalance)) + '</div>' +
      '</div></div></div>';
  }

  /* Sync is the one setup step that matters — offer it here, not buried in settings. */
  if(!syncUrl){
    h += '<div class="syncbanner">' +
      '<div class="t">📱 הנתונים כרגע רק במחשב הזה</div>' +
      '<div class="d">לחיצה אחת ויהיו זמינים גם מהטלפון ומכל מחשב אחר, ' +
      'ומשם זה אוטומטי לגמרי.</div>' +
      '<button class="btn full" data-syncbtn onclick="createBin()">🔗 הפעלת סנכרון</button></div>';
  }

  const due = dueReminders();
  if(due.length){
    h += '<div class="card alert"><h2><span class="bar"></span>🔔 תזכורות להיום<span class="cnt">' +
      due.length + '</span></h2>' + due.map(remRow).join('') + '</div>';
  }

  if(!DB.payments.length){
    return h + '<div class="card"><div class="empty">' +
      '<div style="font-size:38px;margin-bottom:8px">💰</div>' +
      'עוד אין תשלומים.<br>מוסיפים שם, טלפון וסכום — וזהו.' +
      '<div style="margin-top:16px"><button class="btn" onclick="editPayment()">＋ תשלום חדש</button></div>' +
      '</div></div>';
  }

  h += '<div class="chips" style="margin-bottom:12px">' +
    [['open','פתוחים'],['paid','נסגרו'],['all','הכל']].map(f =>
      '<button class="chip' + (listFilter === f[0] ? ' on' : '') +
      '" onclick="listFilter=\'' + f[0] + '\';render()">' + f[1] + '</button>' ).join('') +
    (DB.payments.length > 1
      ? '<button class="chip' + (reorderMode ? ' on' : '') + '" onclick="toggleReorder()">⇅ סידור</button>'
      : '') + '</div>';
  if(reorderMode){
    h += '<div class="reorderbar"><span style="font-size:20px">⇅</span>' +
      '<span>מצב סידור — הזיזי כרטיסים לפי מה שדחוף לך</span></div>';
  } else {
    h += '<div class="search"><input type="text" id="lq" placeholder="חיפוש לפי שם או טלפון" value="' +
         esc(listQ) + '" oninput="listQ=this.value;renderList()"></div>';
  }
  h += '<div id="payList">' + listHTML() + '</div>';
  return h;
}
function renderList(){ $('payList').innerHTML = listHTML(); }
function listHTML(){
  const list = visiblePayments();
  if(!list.length) return '<div class="card"><div class="empty">אין תשלומים להצגה</div></div>';
  const last = list.length - 1;

  return '<div class="tiles">' + list.map((p, i) => {
    const amt = Number(p.amount) || 0, pd = paidOf(p.id), bal = amt - pd;
    const pct = amt > 0 ? Math.min(100, Math.round(pd / amt * 100)) : 0;
    const hasDue = DB.entries.some(e => e.paymentId === p.id && e.reminderAt &&
                                        !e.reminderDone && daysUntil(e.reminderAt) <= 0);
    let h = '<div class="tile' + (p.closed ? ' done' : '') + (hasDue ? ' due' : '') +
      (reorderMode ? '' : ' tap') + '"' +
      (reorderMode ? '' : ' onclick="go(\'pay\',\'' + p.id + '\')"') + '>';
    if(reorderMode) h += '<div class="pos">' + (i + 1) + '</div>';
    else if(hasDue) h += '<div class="bell">🔔</div>';
    h += '<div class="tname">' + esc(p.name) + '</div>';
    h += '<div class="tamt" style="color:' + (bal > 0.5 ? 'var(--bad)' : 'var(--ok)') + '">' +
      (bal > 0.5 ? money(bal) : '✓') + '</div>';
    h += '<div class="tsub">' + (bal > 0.5
      ? (pd > 0 ? 'מתוך ' + money(amt) : 'לגבייה')
      : 'שולם במלואו') + '</div>';
    if(pd > 0 && bal > 0.5) h += '<div class="tbar"><i style="width:' + pct + '%"></i></div>';
    if(reorderMode){
      h += '<div class="mv">' +
        '<button onclick="movePayment(\'' + p.id + '\',-1)"' + (i === 0 ? ' disabled' : '') +
          ' title="הקדם">↑</button>' +
        '<button onclick="movePayment(\'' + p.id + '\',1)"' + (i === last ? ' disabled' : '') +
          ' title="אחר">↓</button></div>';
    }
    return h + '</div>';
  }).join('') + '</div>';
}
function remRow(e){
  const d = daysUntil(e.reminderAt);
  const when = d < 0 ? 'עבר לפני ' + Math.abs(d) + ' ימים' : d === 0 ? 'היום' : 'בעוד ' + d + ' ימים';
  return '<div class="row">' +
    '<div class="grow clickable" onclick="go(\'pay\',\'' + e.paymentId + '\')">' +
    '<div class="nm">' + esc(payName(e.paymentId)) + '</div>' +
    '<div class="meta">' + esc(remMsg(e)) + '<br>' +
      '<span class="badge ' + (d <= 0 ? 'b-late' : 'b-soon') + '">' + heDate(e.reminderAt) + ' · ' + when + '</span>' +
    '</div></div>' +
    '<button class="btn sm ok" onclick="doneReminder(\'' + e.id + '\')">בוצע</button></div>';
}
async function doneReminder(id){
  const e = DB.entries.find(x => x.id === id);
  if(e) e.reminderDone = true;
  await save(); render(); toast('התזכורת סומנה כבוצעה');
}
async function snoozeReminder(id, days){
  const e = DB.entries.find(x => x.id === id);
  if(e){ e.reminderAt = addDays(todayKey(), days); e.reminderDone = false; }
  await save(); render(); toast('נדחתה ל־' + days + ' ימים');
}

/* ==================================================================
   9. ADD / EDIT A PAYMENT  — name, phone, amount
   ================================================================== */
function editPayment(id){
  const p = id ? payById(id) : null;
  modal(p ? 'עריכת תשלום' : 'תשלום חדש',
    fld('שם הלקוח *', '<input type="text" id="p_name" value="' + esc(p ? p.name : '') + '">') +
    fld('טלפון', '<input type="tel" id="p_phone" value="' + esc(p ? p.phone : '') + '">') +
    fld('סכום (₪) *', '<input type="number" id="p_amount" step="0.01" min="0" value="' +
        (p && p.amount ? p.amount : '') + '">') +
    fld('הערות', '<textarea id="p_notes">' + esc(p ? p.notes : '') + '</textarea>') +
    '<button class="btn full" onclick="savePayment(' + (id ? "'" + id + "'" : 'null') + ')">שמירה</button>');
  focusSoon('p_name');
}
async function savePayment(id){
  const name = $('p_name').value.trim();
  if(!name) return toast('חובה להזין שם');
  const amount = Number($('p_amount').value) || 0;
  const data = {name, phone:$('p_phone').value.trim(), amount, notes:$('p_notes').value.trim()};
  let newId = id;
  if(id) Object.assign(payById(id), data);
  else {
    newId = uid();
    normalizeOrder();
    const first = DB.payments.reduce((m,p) => Math.min(m, p.order || 0), 0);
    DB.payments.push(Object.assign({id:newId, createdAt:todayKey(), order:first - 1}, data));
  }
  closeModal();
  const closed = await save();
  if(id) render(); else go('pay', newId);
  toast(closed.length ? 'שולם הכל — הכרטיס נסגר ✓' : 'נשמר');
}
async function delPayment(id){
  const n = DB.entries.filter(e => e.paymentId === id).length;
  if(!confirm(n ? 'לתשלום זה ' + n + ' שורות ביומן. המחיקה תמחק גם אותן. להמשיך?' : 'למחוק תשלום זה?')) return;
  DB.entries = DB.entries.filter(e => e.paymentId !== id);
  DB.payments = DB.payments.filter(p => p.id !== id);
  await save(); go('list'); toast('נמחק');
}

function entryHTML(e){

  const remLive = e.reminderAt && !e.reminderDone;
  const d = remLive ? daysUntil(e.reminderAt) : null;

  h += '<div class="top"><div style="flex:1;min-width:0">' +
       '<div class="dt">' + heDateLong(e.date) + '</div>' +
       '<div class="txt">' + (e.content ? esc(e.content) : '<span class="muted">—</span>') + '</div></div>';
  if(hasMoney) h += '<div class="sum">' + money(e.amount) + '</div>';
  h += '</div>';
  if(remLive){
    h += '<div class="rembox' + (d <= 0 ? ' due' : '') + '">🔔 ' + esc(remMsg(e)) +
         ' · ' + heDate(e.reminderAt) +
         (d < 0 ? ' (עבר לפני ' + Math.abs(d) + ' ימים)' : d === 0 ? ' (היום)' : ' (בעוד ' + d + ' ימים)') + '</div>';
  } else if(e.reminderAt && e.reminderDone){

function editEntry(id, paymentId){
  if(!DB.payments.length){ toast('צריך להוסיף תשלום קודם'); return; }
  const e = id ? DB.entries.find(x => x.id === id) : null;
  const pid = e ? e.paymentId : (paymentId || curPay || DB.payments[0].id);
  const opts = DB.payments.slice().sort((a,b) => a.name.localeCompare(b.name,'he'))
    .map(p => '<option value="' + p.id + '"' + (p.id === pid ? ' selected' : '') + '>' + esc(p.name) + '</option>').join('');

  const remDays = remOn ? Math.max(0, daysUntil(e.reminderAt)) : 7;

    fld('תשלום *', '<select id="e_pay">' + opts + '</select>') +
    fld('תאריך *', '<input type="date" id="e_date" value="' + esc(e ? e.date : todayKey()) + '">') +
    fld('תוכן', '<textarea id="e_content" placeholder="מה קרה / מה סוכם / איזה תשלום התקבל">' +
        esc(e ? e.content : '') + '</textarea>' +
        '<div class="chips" style="margin-top:8px">' +
        QUICK_TEXTS.map(t => '<button type="button" class="chip" onclick="addQuick(this)">' +
          esc(t) + '</button>').join('') + '</div>') +
    fld('סכום ששולם (₪) — אם התקבל תשלום',
        '<input type="number" id="e_amount" step="0.01" min="0" placeholder="השאירי ריק אם זו רק רשומה" value="' +
        (e && Number(e.amount) > 0 ? e.amount : '') + '">') +
    '<div class="switch" onclick="if(event.target.tagName!==\'INPUT\')' +
      '{var b=document.getElementById(\'e_rem\');b.checked=!b.checked;toggleRem();}">' +
      '<input type="checkbox" id="e_rem"' + (remOn ? ' checked' : '') + ' onchange="toggleRem()">' +
      '<label for="e_rem">🔔 הפעלת תזכורת</label></div>' +
    '<div id="remFields" class="hide">' +
      fld('תזכורת בעוד כמה ימים?',
          '<div class="chips" style="margin-bottom:9px">' +
          [3,7,14,30,60].map(d => '<button type="button" class="chip" onclick="setRemDays(' + d + ')">' +
            d + ' ימים</button>').join('') + '</div>' +
          '<input type="number" id="e_remdays" min="0" value="' + remDays + '" oninput="updRemHint()">') +
      fld('הטקסט שיקפוץ עם התזכורת',
          '<input type="text" id="e_remtext" placeholder="למשל: להתקשר לדוד בעניין היתרה" value="' +
          esc(e ? e.reminderText : '') + '">' +
          '<div class="hint">אם נשאיר ריק — יוצג התוכן של השורה.</div>') +
      '<div class="okbox" id="remHint"></div>' +
    '</div>' +
    '<button class="btn full" onclick="saveEntry(' + (id ? "'" + id + "'" : 'null') + ')">שמירה</button>');

  $('e_date').addEventListener('change', updRemHint);
  toggleRem();
  focusSoon('e_content');
}
/** Append a quick phrase rather than replacing what is already typed. */
function addQuick(btn){
  const t = $('e_content');
  t.value = t.value.trim() ? t.value.trim() + ' · ' + btn.textContent : btn.textContent;
  t.focus();
}
function setRemDays(d){ $('e_remdays').value = d; updRemHint(); }
function toggleRem(){
  const on = $('e_rem').checked;
  $('remFields').classList.toggle('hide', !on);
  if(on) updRemHint();
}
function updRemHint(){
  const d = Math.max(0, Number($('e_remdays').value) || 0);
  $('remHint').innerHTML = 'התזכורת תופיע ב־<b>' + heDateLong(addDays($('e_date').value || todayKey(), d)) + '</b>';
}
async function saveEntry(id){
  const date = $('e_date').value;
  if(!date) return toast('חובה להזין תאריך');
  const amtRaw = $('e_amount').value.trim();
  const amount = amtRaw === '' ? 0 : Number(amtRaw);
  if(amount < 0 || isNaN(amount)) return toast('סכום לא תקין');
  const content = $('e_content').value.trim();
  if(!content && !amount) return toast('צריך תוכן או סכום');

  const remOn = $('e_rem').checked;
  const data = {
    paymentId: $('e_pay').value, date, content, amount,
    reminderAt: remOn ? addDays(date, Math.max(0, Number($('e_remdays').value) || 0)) : null,
    reminderText: remOn ? $('e_remtext').value.trim() : '',
    reminderDone: false
  };
  if(id){
    const e = DB.entries.find(x => x.id === id);
    /* an unchanged reminder that was already ticked off stays ticked off */
    if(remOn && e.reminderAt === data.reminderAt && e.reminderDone) data.reminderDone = true;
    Object.assign(e, data);
  } else {
    DB.entries.push(Object.assign({id:uid(), createdAt:new Date().toISOString()}, data));
  }
  closeModal();
  const closed = await save();
  render();
  toast(closed.length ? 'שולם הכל — הכרטיס נסגר ✓' : 'נשמר');
}
async function delEntry(id){
  if(!confirm('למחוק שורה זו?')) return;
  DB.entries = DB.entries.filter(e => e.id !== id);
  await save(); render(); toast('נמחק');
}

function viewReports(){
  const months = [];

  }

  h += '<div class="bars" style="margin-top:12px">' + months.map(k => {
    const v = byMonth[k], [y,mm] = k.split('-');
    return '<div class="barrow"><div class="bl">' + mm + '/' + y.slice(2) + '</div>' +
      '<div class="bt"><i style="width:' + Math.round(v / max * 100) + '%"></i></div>' +

  const rows = DB.payments.map(p => ({name:p.name, phone:p.phone, a:Number(p.amount)||0,

    .sort((a,b) => b.bal - a.bal);
  h += '<div class="card"><h2><span class="bar"></span>פירוט מלא</h2>';
  h += rows.length
    ? '<div style="overflow-x:auto"><table class="rep"><thead><tr><th>שם</th><th>סכום</th><th>שולם</th><th>יתרה</th></tr></thead><tbody>' +
      rows.map(r => '<tr><td>' + esc(r.name) + '</td><td>' + money(r.a) + '</td>' +
        '<td style="color:var(--ok)">' + money(r.pd) + '</td>' +
        '<td style="color:' + (r.bal > 0.5 ? 'var(--bad)' : 'var(--ok)') + ';font-weight:700">' +
        money(r.bal) + '</td></tr>').join('') + '</tbody></table></div>'
    : '<div class="empty">אין נתונים</div>';
  h += '</div>';

  h += '<div class="card"><h2><span class="bar"></span>ייצוא</h2>' +
    '<div class="btnbar"><button class="btn sm sec" onclick="exportCSV()">ייצוא ל־CSV</button>' +
    '<button class="btn sm sec" onclick="exportJSON()">גיבוי מלא (JSON)</button></div>' +
    '<div class="hint">קובץ ה־CSV נפתח באקסל. הגיבוי המלא אינו מוצפן — שמרי אותו במקום בטוח.</div></div>';
  return h;
}
function exportCSV(){
  const cell = v => '"' + String(v == null ? '' : v).replace(/"/g,'""') + '"';
  const lines = [['שם','טלפון','תאריך','תוכן','סכום ששולם','תזכורת','טקסט התזכורת','בוצעה'].join(',')];
  DB.entries.slice().sort((a,b) => a.date < b.date ? 1 : -1).forEach(e => {
    const p = payById(e.paymentId);
    lines.push([p ? p.name : '', p ? p.phone : '', e.date, e.content || '',
                Number(e.amount) > 0 ? e.amount : '',
                e.reminderAt || '', e.reminderText || '',
                e.reminderAt ? (e.reminderDone ? 'כן' : 'לא') : ''].map(cell).join(','));
  });
  lines.push('');
  lines.push(['—— סיכום ——'].map(cell).join(','));
  lines.push(['שם','טלפון','סכום','שולם','יתרה'].join(','));
  DB.payments.forEach(p => {
    lines.push([p.name, p.phone || '', Number(p.amount)||0, paidOf(p.id), balanceOf(p)].map(cell).join(','));
  });
  download('﻿' + lines.join('\r\n'), 'shkar-tirha-' + todayKey() + '.csv', 'text/csv;charset=utf-8');
}
function exportJSON(){
  download(JSON.stringify(DB, null, 2), 'fee-backup-' + todayKey() + '.json', 'application/json');
}
function download(text, name, type){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type}));
  a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast('הקובץ ירד');
}

/** The link that connects another device: carries the store id, never the password. */
function syncLink(){
  return location.origin + location.pathname + '#sync=' + syncUrl.split('/').pop();
}
/** Create the cloud store from inside the app — no external site, no account. */
async function createBin(){
  /* the button lives in two places — the main-screen banner and settings */
  const btns = [...document.querySelectorAll('[data-syncbtn]')];
  btns.forEach(b => { b.disabled = true; b.textContent = 'מפעיל…'; });
  try{
    const r = await fetch('https://www.npoint.io/documents', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({contents:'{}'})});
    if(!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    if(!j.token) throw new Error('no token');
    syncUrl = 'https://api.npoint.io/' + j.token;
    localStorage.setItem(LS_SYNC, syncUrl);
    await save();          // seed the store with what is already on this device
    render();
    toast('הסנכרון הופעל ✓');
  } catch(e){
    btns.forEach(b => { b.disabled = false; b.textContent = '🔗 הפעלת סנכרון'; });
    toast('לא הצלחתי להפעיל — בדקי חיבור לאינטרנט');
  }
}
async function copyLink(){
  const link = syncLink();
  try{ await navigator.clipboard.writeText(link); toast('הקישור הועתק'); }
  catch(e){ $('s_link').select(); document.execCommand('copy'); toast('הקישור הועתק'); }
}
async function shareLink(){
  try{ await navigator.share({title:'מעקב שכר טרחה', url:syncLink()}); }
  catch(e){ /* the user dismissed the share sheet */ }
}
async function disconnectSync(){
  if(!confirm('לנתק את הסנכרון במכשיר הזה? הנתונים יישארו כאן ובענן, אבל יפסיקו להתעדכן זה מזה.')) return;
  syncUrl = '';
  localStorage.removeItem(LS_SYNC);
  await save(); render(); toast('הסנכרון נותק');
}
async function pullNow(){
  try{
    const blob = await fetchRemote();
    if(!blob) return toast('אין נתונים בענן');
    DB = migrate(await decryptDB(blob, KEY));
    localStorage.setItem(LS_BLOB, JSON.stringify(blob));
    setSync('ok', '☁️ מסונכרן');
    render(); toast('הנתונים עודכנו מהענן');
  } catch(e){
    toast(e.name === 'OperationError' ? 'הסיסמה בענן שונה' : 'שגיאה במשיכה');
  }
}
async function saveNotify(){
  const on = $('s_notify').checked;
  if(on && 'Notification' in window && Notification.permission !== 'granted'){
    const p = await Notification.requestPermission();
    if(p !== 'granted'){ $('s_notify').checked = false; return toast('הדפדפן חסם התראות'); }
  }
  DB.settings.notify = on;
  await save(); toast(on ? 'התראות הופעלו' : 'התראות בוטלו');
}
function changePassModal(){
  modal('שינוי סיסמה',
    '<div class="warnbox">אם תשכחי את הסיסמה החדשה — לא תהיה דרך לשחזר את הנתונים. ' +
    'מומלץ להוריד גיבוי לפני השינוי.</div>' +
    fld('סיסמה חדשה', '<input type="password" id="np1">') +
    fld('אימות', '<input type="password" id="np2">') +
    '<button class="btn full" onclick="doChangePass()">שינוי</button>');
}
async function doChangePass(){
  const a = $('np1').value, b = $('np2').value;
  if(a.length < 4) return toast('סיסמה קצרה מדי');
  if(a !== b) return toast('הסיסמאות אינן זהות');
  SALT = crypto.getRandomValues(new Uint8Array(16));
  KEY = await deriveKey(a, SALT);
  if(localStorage.getItem(LS_PASS) !== null) localStorage.setItem(LS_PASS, a);
  closeModal(); await save(); toast('הסיסמה שונתה');
}
function lockNow(){ localStorage.removeItem(LS_PASS); location.reload(); }
async function importJSON(input){
  const f = input.files[0]; if(!f) return;
  try{
    const obj = JSON.parse(await f.text());
    if(!obj || !(Array.isArray(obj.payments) || Array.isArray(obj.clients))) throw new Error('bad');
    if(!confirm('השחזור יחליף את כל הנתונים הקיימים. להמשיך?')) return;
    DB = migrate(obj);
    await save(); go('list'); toast('שוחזר בהצלחה');
  } catch(e){ toast('קובץ לא תקין'); }
  input.value = '';
}
async function wipe(){
  if(!confirm('פעולה זו תמחק את כל התשלומים והשורות. להמשיך?')) return;
  if(!confirm('בטוחה? אין דרך חזרה (אלא אם יש לך גיבוי).')) return;
  DB = freshDB(); await save(); go('list'); toast('הכל נמחק');
}

/* ==================================================================
   15. MODAL
   ================================================================== */
function fld(label, inner){ return '<div class="fld"><label>' + label + '</label>' + inner + '</div>'; }
function modal(title, body){
  $('modalHost').innerHTML =
    '<div class="modal" onclick="if(event.target===this)closeModal()"><div class="modal-in">' +
    '<div class="modal-h"><h3>' + esc(title) + '</h3><button class="x" onclick="closeModal()">×</button></div>' +
    body + '</div></div>';
}
function closeModal(){ $('modalHost').innerHTML = ''; }
/** Focus a field once the modal has painted, tolerating an instant close. */
function focusSoon(id){ setTimeout(() => { const el = $(id); if(el) el.focus(); }, 80); }

/* ==================================================================
   16. UNLOCK
   ================================================================== */
let mode = 'unlock', bootBlob = null;

async function boot(){
  syncUrl = localStorage.getItem(LS_SYNC) || '';
  /* opened via the connect link from another device — adopt its store */
  const m = location.hash.match(/sync=([A-Za-z0-9_-]+)/);
  if(m){
    syncUrl = 'https://api.npoint.io/' + m[1];
    localStorage.setItem(LS_SYNC, syncUrl);
    history.replaceState(null, '', location.pathname);
  }
  bootBlob = localBlob();
  let remoteFailed = false;
  if(syncUrl){
    try { const r = await fetchRemote(); if(r) bootBlob = r; }
    catch(e){ remoteFailed = true; }
  }

  /* A synced device with nothing local must never start a fresh database while the
     cloud copy is merely unreachable — that would overwrite it on the first save. */
  if(syncUrl && remoteFailed && !bootBlob){
    $('lockSub').innerHTML = 'אין כרגע חיבור לאינטרנט, ולא הצלחתי להגיע לנתונים בענן.<br>' +
      'בדקי את החיבור ורענני את הדף.';
    $('lockForm').classList.add('hide');
    return;
  }

  mode = bootBlob ? 'unlock' : 'setup';
  $('lockSub').innerHTML = mode === 'setup'
    ? 'ברוכה הבאה. בחרי סיסמה שתגן על הנתונים.<br>הנתונים מוצפנים — רק הסיסמה הזו פותחת אותם.'
    : 'הזיני את הסיסמה שלך';
  $('pass2').classList.toggle('hide', mode !== 'setup');
  $('lockGo').textContent = mode === 'setup' ? 'יצירת המערכת' : 'כניסה';
  $('lockNote').innerHTML = mode === 'setup'
    ? '<b>חשוב לדעת:</b> אין "שכחתי סיסמה". הסיסמה לא נשמרת בשום שרת, ולכן אם היא תאבד — הנתונים לא ניתנים לשחזור. רשמי אותה במקום בטוח.'
    : '';
  $('lockForm').classList.remove('hide');

  const saved = localStorage.getItem(LS_PASS);
  if(saved && mode === 'unlock'){
    $('remember').checked = true; $('pass1').value = saved; tryUnlock(true);
  } else $('pass1').focus();
}

async function tryUnlock(silent){
  const p1 = $('pass1').value, err = $('lockErr');
  err.textContent = '';

  if(mode === 'setup'){
    if(p1.length < 4) return err.textContent = 'הסיסמה צריכה להיות באורך 4 תווים לפחות';
    if(p1 !== $('pass2').value) return err.textContent = 'הסיסמאות אינן זהות';
    /* Last line of defence: never let a brand-new database land on top of a cloud
       store that already holds data (e.g. the other device saved a moment ago). */
    if(syncUrl){
      try{
        const r = await fetchRemote();
        if(r){
          bootBlob = r; mode = 'unlock';
          $('pass2').classList.add('hide');
          $('lockSub').textContent = 'כבר יש נתונים בענן. הזיני את הסיסמה הקיימת.';
          $('lockGo').textContent = 'כניסה';
          return;
        }
      } catch(e){
        return err.textContent = 'אין חיבור לאינטרנט — נסי שוב בעוד רגע';
      }
    }
    SALT = crypto.getRandomValues(new Uint8Array(16));
    KEY = await deriveKey(p1, SALT);
    DB = freshDB();
    if($('remember').checked) localStorage.setItem(LS_PASS, p1);
    await save();
    return enterApp();
  }

  if(!p1) return err.textContent = 'הזיני סיסמה';
  $('lockGo').disabled = true; $('lockGo').textContent = 'פותח…';
  try{
    SALT = unb64(bootBlob.salt);
    KEY = await deriveKey(p1, SALT);
    DB = await decryptDB(bootBlob, KEY);

    const local = localBlob();
    if(local && local !== bootBlob){
      try{
        const lDB = await decryptDB(local, KEY);
        if(lDB.updatedAt > DB.updatedAt){ DB = lDB; dirty = true; }
      } catch(e){ /* local copy uses an older password — ignore */ }
    }

    const wasOld = DB.v !== 3;
    DB = migrate(DB);
    if(!DB.settings) DB.settings = {notify:false};

    if($('remember').checked) localStorage.setItem(LS_PASS, p1);
    else localStorage.removeItem(LS_PASS);
    localStorage.setItem(LS_BLOB, JSON.stringify(bootBlob));
    enterApp();
    if(wasOld){ await save(); toast('הנתונים הומרו למבנה החדש'); }
    else if(dirty) save();
  } catch(e){
    localStorage.removeItem(LS_PASS);
    err.textContent = 'סיסמה שגויה';
    $('pass1').value = '';
    if(!silent) $('pass1').focus();
  }
  $('lockGo').disabled = false;
  $('lockGo').textContent = mode === 'setup' ? 'יצירת המערכת' : 'כניסה';
}

function enterApp(){
  $('lock').classList.add('hide');
  $('app').classList.remove('hide');
  setSync(syncUrl ? 'ok' : '', syncUrl ? '☁️ מסונכרן' : '💾 מקומי בלבד — הקישי להפעלת סנכרון');
  go('list');
  const due = dueReminders();
  if(due.length && DB.settings.notify && 'Notification' in window && Notification.permission === 'granted'){
    const body = due.length === 1
      ? payName(due[0].paymentId) + ' — ' + remMsg(due[0])
      : due.length + ' תזכורות מחכות לך';
    try{ new Notification('מעקב שכר טרחה', {body}); } catch(e){}
  }
}

$('lockGo').onclick = () => tryUnlock(false);
['pass1','pass2'].forEach(id => $(id).addEventListener('keydown', e => {
  if(e.key === 'Enter') tryUnlock(false);
}));

boot();
</script>
